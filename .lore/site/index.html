<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lore wiki</title>
<style>
  :root {
    --bg: #1a1b26; --sidebar: #16161e; --panel: #1f2130;
    --fg: #c0caf5; --fg-dim: #565f89; --fg-bright: #ffffff;
    --accent: #7aa2f7; --accent-dim: #3d59a1;
    --green: #9ece6a; --yellow: #e0af68; --red: #f7768e;
    --border: #2a2e42; --code-bg: #1e202e;
    --comp: #7dcfff; --flow: #bb9af7; --theme: #ff9e64; --docs: var(--green);
    --warn: #e0af68;
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --sidebar:#f4f5f8; --panel:#eef0f4; --fg:#24283b; --fg-dim:#787c99;
    --fg-bright:#1a1b26; --accent:#3760bf; --accent-dim:#a4b3e0; --border:#dcdfe6;
    --code-bg:#eef0f4; --green:#587539; --yellow:#8c6c20; --red:#c64343;
    --comp:#2e7de9; --flow:#7847bd; --theme:#b15c00;
    --warn: #b15c00;
  }
  :root[data-theme="sepia"] {
    --bg:#f4ecd8; --sidebar:#ece2c8; --panel:#e7dcc0; --fg:#5b4636; --fg-dim:#9c8b73;
    --fg-bright:#3b2f25; --accent:#9a6a3a; --accent-dim:#cdb892; --border:#d9c9a3;
    --code-bg:#e7dcc0; --green:#6b7536; --yellow:#9a6a20; --red:#a8443a;
    --comp:#7a6a3a; --flow:#8a5a6a; --theme:#9a6a3a;
    --warn: #9a6a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background: var(--bg); color: var(--fg); height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 52px 1fr; height: 100vh; }

  /* top bar */
  #topbar { grid-column: 1 / 3; background: var(--sidebar); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; padding: 0 18px; }
  #brand { font-weight: 700; color: var(--fg-bright); letter-spacing: .5px; }
  #brand .dim { color: var(--fg-dim); font-weight: 400; font-size: 12px; }
  #search { flex: 1; max-width: 420px; }
  #search input { width: 100%; background: var(--panel); border: 1px solid var(--border);
    color: var(--fg); padding: 7px 12px; border-radius: 7px; font-size: 13px; }
  #search input:focus { outline: none; border-color: var(--accent); }
  #theme, #language { background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    padding: 6px 10px; border-radius: 7px; font-size: 13px; cursor: pointer; }
  #theme:focus, #language:focus { outline: none; border-color: var(--accent); }
  #sync-light { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 99px;
    border: 1px solid var(--border); background: var(--panel); color: var(--fg);
    cursor: pointer; font-size: 12px; user-select: none; white-space: nowrap; }
  #sync-light:hover { border-color: var(--accent); }
  #sync-light .ind { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  #sync-light.stale .ind { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
  #sync-light.off .ind { background: var(--fg-dim); }
  #sync-panel { position: absolute; top: 46px; right: 12px; z-index: 50; width: 280px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; box-shadow: 0 10px 28px rgba(0,0,0,.35); font-size: 12.5px; color: var(--fg); }
  #sync-panel .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; gap: 8px; }
  #sync-panel .dim { color: var(--fg-dim); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: none; padding: 3px 10px; cursor: pointer;
    color: var(--fg); font-size: 12px; }
  .seg button.on { background: var(--accent); color: var(--bg); font-weight: 600; }
  .seg button:disabled { color: var(--fg-dim); cursor: not-allowed; opacity: .6; }
  #sync-panel .actions button { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 10px; margin-right: 6px; margin-top: 8px; cursor: pointer; color: var(--fg); font-size: 12px; }
  #sync-panel .actions button:hover { border-color: var(--accent); }
  #sync-panel .actions button:disabled { color: var(--fg-dim); cursor: not-allowed; opacity: .6; }
  #sync-panel[hidden] { display: none; }
  .console-sec { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 14px; }
  .console-sec h3 { margin: 0 0 10px; color: var(--fg-bright); font-size: 15px; }
  .console-sec table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .console-sec th { text-align: left; color: var(--fg-dim); font-weight: 500; font-size: 11px;
    text-transform: uppercase; letter-spacing: .5px; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .console-sec td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
  .console-sec .tag { padding: 1px 8px; border-radius: 99px; font-size: 11px; }
  .console-sec .tag.w { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .console-sec .tag.q { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
  .console-sec button { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 3px 10px; cursor: pointer; color: var(--fg); font-size: 12px; }
  .console-sec button:hover { border-color: var(--accent); }
  .console-sec button:disabled { color: var(--fg-dim); cursor: not-allowed; opacity: .6; }
  #update-bar { background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid var(--accent);
    border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; cursor: pointer; color: var(--fg); font-size: 13px; }
  #update-bar:hover { background: color-mix(in srgb, var(--accent) 20%, transparent); }

  /* sidebar */
  #sidebar { background: var(--sidebar); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px 0; }
  .axis { margin-bottom: 6px; }
  .axis-h { display: flex; align-items: center; gap: 7px; padding: 7px 16px 4px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--fg-dim); cursor: pointer;
    user-select: none; }
  .axis-h .dot { width: 7px; height: 7px; border-radius: 50%; }
  .axis-h .caret { margin-left: auto; transition: transform .15s; font-size: 9px; }
  .axis.collapsed .caret { transform: rotate(-90deg); }
  .axis.collapsed .links { display: none; }
  .dot.component { background: var(--comp); }
  .dot.flow { background: var(--flow); }
  .dot.theme { background: var(--theme); }
  .dot.docs { background: var(--docs); }
  .dot.index { background: var(--fg-dim); }
  .dot.HOME { background: var(--accent); }
  .dot.INDEX { background: var(--fg-dim); }
  .links a { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 5px 16px 5px 30px;
    color: var(--fg); text-decoration: none; font-size: 13px; border-left: 2px solid transparent; }
  .links a:hover { background: var(--panel); }
  .links a.active { background: var(--panel); border-left-color: var(--accent); color: var(--fg-bright); }
  .links a .stale { margin-left: auto; font-size: 10px; color: var(--yellow); }
  .links a .when { flex-basis: 100%; font-size: 10px; color: var(--fg-dim); }
  .links a.hidden { display: none; }
  .links .grp { padding: 6px 16px 2px 30px; font-size: 10px; letter-spacing: .5px;
    color: var(--fg-dim); text-transform: uppercase; }
  .grp-toggle { cursor: pointer; user-select: none; }
  .grp-toggle:hover { color: var(--fg); }
  .grp-toggle .caret { display: inline-block; width: 10px; font-size: 9px; }
  .dgrp.closed .grp-rows { display: none; }
  #sidebar.searching .dgrp .grp-rows { display: block; }   /* 搜索穿透：临时展开全部组 */
  #sidebar.searching .grp-toggle { display: none; }        /* 搜索态平铺命中行，组头让位 */
  .plan-badge { display: inline-block; padding: 0 7px; border-radius: 99px; font-size: 10px;
    border: 1px solid var(--accent-dim); color: var(--accent); margin-left: 6px; cursor: pointer; }
  .plan-badge:hover { border-color: var(--accent); background: var(--panel); }

  /* main */
  #main { overflow-y: auto; padding: 0; }
  #meta { background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 36px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; align-items: center; }
  #meta .chip { display: flex; align-items: center; gap: 6px; color: var(--fg-dim); }
  #meta .chip b { color: var(--fg); font-weight: 500; }
  #meta .chip.stale { color: var(--yellow); }
  #meta .chip.fresh { color: var(--green); }
  #meta button.chip { font: inherit; cursor: pointer; border: 1px solid currentColor;
    background: transparent; border-radius: 6px; padding: 2px 8px; }
  #content { padding: 28px 36px 80px; max-width: 860px; }
  #content h1 { font-size: 28px; color: var(--fg-bright); margin: 8px 0 18px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border); }
  #content h2 { font-size: 20px; color: var(--accent); margin: 28px 0 12px; }
  #content h3 { font-size: 16px; color: var(--fg-bright); margin: 20px 0 8px; }
  #content p { margin: 10px 0; }
  #content ul, #content ol { margin: 10px 0 10px 24px; }
  #content li { margin: 4px 0; }
  #content code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    font-family: "SF Mono",Consolas,monospace; font-size: 12.5px; color: var(--green); }
  #content pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto;
    margin: 12px 0; border: 1px solid var(--border); }
  #content pre code { background: none; padding: 0; color: var(--fg); }
  #content a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
  #content a:hover { border-bottom-color: var(--accent); }
  #content a.wikilink { color: var(--flow); border-bottom-color: transparent;
    background: rgba(187,154,247,.12); padding: 1px 6px; border-radius: 4px; }
  #content a.wikilink::before { content: "🔗 "; font-size: 11px; }
  #content blockquote { border-left: 3px solid var(--accent-dim); padding: 4px 16px; margin: 12px 0;
    color: var(--fg-dim); background: rgba(122,162,247,.05); }
  #content table { border-collapse: collapse; margin: 14px 0; width: 100%; }
  #content th, #content td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; font-size: 13px; }
  #content th { background: var(--panel); color: var(--fg-bright); }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
  .tl { border-left: 2px solid var(--border); padding-left: 18px; margin: 14px 0; }
  .tl-item { position: relative; margin: 16px 0; }
  .tl-item::before { content: ""; position: absolute; left: -23px; top: 6px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); }
  .tl-item .when { font-size: 11px; color: var(--fg-dim); }
  .tl-item .badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .badge.extracted { background: rgba(158,206,106,.15); color: var(--green); }
  .badge.inferred { background: rgba(224,175,104,.15); color: var(--yellow); }
  .hidden { display: none; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  #content .mermaid { cursor: zoom-in; }
  #lb { position: fixed; inset: 0; z-index: 99; display: none; background: rgba(0,0,0,.78); }
  #lb.open { display: block; }
  #lb-stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
  #lb-stage svg { position: absolute; top: 50%; left: 50%; transform-origin: 0 0; cursor: grab; max-width: none;
    background: var(--bg); border-radius: 8px; padding: 16px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
  #lb-stage.dragging svg { cursor: grabbing; }
  #lb-bar { position: absolute; top: 14px; right: 16px; display: flex; gap: 8px; z-index: 1; }
  #lb-bar button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35);
    width: 34px; height: 34px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  #lb-bar button:hover { background: rgba(255,255,255,.25); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="brand">lore <span class="dim">// .lore/wiki</span></div>
    <div id="search"><input id="q" placeholder="🔍 搜索页面 (title + 摘要)..." autocomplete="off"></div>
    <select id="language" title="Language"></select>
    <select id="theme" title="主题">
      <option value="dark">🌙 暗</option>
      <option value="light">☀ 亮</option>
      <option value="sepia">🌿 护眼</option>
    </select>
    <div id="sync-light" title="sync 状态"><span class="ind"></span><span id="sync-light-text">…</span></div>
  </div>
  <div id="sync-panel" hidden>
    <div class="row"><span class="dim">档位</span>
      <span class="seg">
        <button data-mode="manual">手动</button>
        <button data-mode="notify">提醒</button>
        <button data-mode="auto" disabled title="B2 解锁">全自动 🔒</button>
      </span>
    </div>
    <div class="row"><span class="dim">待重写</span><span id="sync-stale-summary">—</span></div>
    <div class="row"><span class="dim">上次机械刷新</span><span id="sync-last">—</span></div>
    <div class="actions">
      <button id="sync-finalize">⟳ 立即刷新</button>
      <button id="sync-queue-all">✍ 重写排队</button>
      <button id="sync-detail">详情 →</button>
    </div>
  </div>
  <nav id="sidebar"></nav>
  <main id="main">
    <div id="meta"></div>
    <article id="content"></article>
  </main>
</div>

<div id="lb">
  <div id="lb-bar">
    <button id="lb-in" title="放大">＋</button>
    <button id="lb-out" title="缩小">−</button>
    <button id="lb-reset" title="复位">⟲</button>
    <button id="lb-close" title="关闭 (ESC)">✕</button>
  </div>
  <div id="lb-stage"></div>
</div>

<script type="module">
import {
  stripFrontmatter, renderMarkdown, buildPageIndex, preprocessWikilinks,
  buildNavModel, buildMeta, chooseInitialLanguage, resolveLocalizedPage,
  baseFromPathname, buildConsoleModel, pollDecide, buildDocsRows,
} from './shell.mjs';

// per-repo serve 下 BASE="/"（行为同旧 ../wiki）；portal 下 BASE="/<repo>/"。
const BASE = baseFromPathname(location.pathname);

const mapMermaidTheme = t => (t === 'dark' ? 'dark' : 'default');
const themedSrc = (src, t) => `%%{init: {'theme':'${mapMermaidTheme(t)}'}}%%\n` + src;   // per-diagram 主题指令：每次渲染重新定主题，绕过 mermaid 全局 init 的主题缓存

let mermaidLoad = null;   // Promise once mermaid.min.js has been injected + initialized
function ensureMermaid() {
  if (!mermaidLoad) {
    mermaidLoad = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = './mermaid.min.js';
      s.onload = () => {
        try {
          window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: mapMermaidTheme(document.documentElement.getAttribute('data-theme')) });
          resolve();
        } catch (e) { mermaidLoad = null; reject(e); }
      };
      s.onerror = (e) => { mermaidLoad = null; reject(e); };
      document.head.appendChild(s);
    });
  }
  return mermaidLoad;
}

let MANIFEST = { axes: [] }, PAGE_INDEX = {}, FLAT = {}, SELECTED_LANG = 'en';

async function boot() {
  MANIFEST = await (await fetch(BASE + 'wiki/.manifest.json')).json();
  PAGE_INDEX = buildPageIndex(MANIFEST);
  FLAT = {};
  for (const ax of MANIFEST.axes) for (const p of ax.pages) FLAT[`${ax.id}/${p.id}`] = p;
  SELECTED_LANG = chooseInitialLanguage(MANIFEST, localStorage.getItem('lore-language'));
  buildSidebar();
  wireSearch();
  wireTheme();
  wireLanguage();
  await fetchSyncStatus();
  wireSyncConsole();
  renderSyncLight();
  LAST_GENERATED = MANIFEST.generated ?? null;
  schedulePoll(15000);
  window.addEventListener('hashchange', route);
  route();
}

function wireLanguage() {
  const sel = document.getElementById('language');
  const cfg = MANIFEST.language ?? { default: 'en', available: ['en'] };
  sel.innerHTML = cfg.available.map(lang => `<option value="${lang}">${lang}</option>`).join('');
  sel.value = SELECTED_LANG;
  sel.style.display = cfg.available.length > 1 ? '' : 'none';
  sel.addEventListener('change', async () => {
    SELECTED_LANG = sel.value;
    localStorage.setItem('lore-language', SELECTED_LANG);
    try {
      await fetch(BASE + 'api/preferences', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ language: SELECTED_LANG }),
      });
    } catch { /* static (python) server has no API; localStorage still persists */ }
    route();
  });
}

function buildSidebar() {
  const nav = document.getElementById('sidebar');
  const linkHtml = (ax, p) => `<a href="#${ax.id}/${p.id}" data-key="${ax.id}/${p.id}"
     data-search="${(p.title + ' ' + (p.summary||'')).toLowerCase()}">
    ${p.title}${p.stale ? `<span class="stale">⚠${p.stale}</span>` : ''}</a>`;
  const DOCS_ICON = { '项目状态': '📌', '设计与计划': '📐', 'notes': '📝' };
  const docsGroupsState = () => {
    try { return JSON.parse(localStorage.getItem('lore-docs-groups') || '{}'); } catch { return {}; }
  };
  const docsHtml = (ax) => {
    const opened = docsGroupsState();
    return buildDocsRows(ax.pages).map(g => {
      const open = g.group in opened ? !!opened[g.group] : !g.collapsed;
      const rows = g.rows.map(r => `<a href="#${ax.id}/${r.page.id}" data-key="${ax.id}/${r.page.id}"
         data-search="${(r.page.title + ' ' + (r.page.summary || '') + ' ' + r.page.id + (r.planPage ? ' ' + r.planPage.id : '')).toLowerCase()}">
        ${r.displayTitle}${r.planPage ? `<span class="plan-badge" data-plan="${ax.id}/${r.planPage.id}" title="查看实施计划">plan</span>` : ''}${r.page.last_updated ? `<span class="when">📅 ${r.page.last_updated}</span>` : ''}</a>`).join('');
      return `<div class="dgrp${open ? '' : ' closed'}" data-group="${g.group}">
        <div class="grp grp-toggle"><span class="caret">${open ? '▾' : '▸'}</span>${DOCS_ICON[g.group] ?? ''} ${g.group} (${g.rows.length})</div>
        <div class="grp-rows">${rows}</div>
      </div>`;
    }).join('');
  };
  const pagesHtml = (ax) => {
    if (ax.id === 'docs') return docsHtml(ax);
    if (ax.id !== 'component') return ax.pages.map(p => linkHtml(ax, p)).join('');
    let out = '', lastGroup = null;                          // component 轴：按连续 group 插小标题
    for (const p of ax.pages) {
      const g = p.group || '';
      if (g && g !== lastGroup) out += `<div class="grp">▸ ${g}</div>`;
      lastGroup = g;
      out += linkHtml(ax, p);
    }
    return out;
  };
  nav.innerHTML = buildNavModel(MANIFEST).map(ax => `
    <div class="axis" data-axis="${ax.id}">
      <div class="axis-h"><span class="dot ${ax.id}"></span>${ax.label}<span class="caret">▼</span></div>
      <div class="links">${pagesHtml(ax)}</div>
    </div>`).join('');
  nav.querySelectorAll('.axis-h').forEach(h =>
    h.onclick = () => h.parentElement.classList.toggle('collapsed'));
  nav.querySelectorAll('.grp-toggle').forEach(h => h.onclick = () => {
    const box = h.parentElement;
    const nowOpen = box.classList.toggle('closed') === false;
    h.querySelector('.caret').textContent = nowOpen ? '▾' : '▸';
    const st = docsGroupsState();
    st[box.dataset.group] = nowOpen;
    localStorage.setItem('lore-docs-groups', JSON.stringify(st));
  });
  nav.querySelectorAll('.plan-badge').forEach(b => b.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();               // 别触发外层 <a> 的 spec 跳转
    location.hash = b.dataset.plan;
  });
}

function renderMeta(page) {
  const cls = { plain: 'chip', stale: 'chip stale', fresh: 'chip fresh' };
  return buildMeta(page).chips.map(c =>
    `<span class="${cls[c.kind]}">${c.icon} ${c.text}</span>`).join('');
}

function renderTranslateState(page, localized) {
  if (!localized.missing && !localized.stale) return '';
  const text = localized.stale ? `translation stale: ${localized.lang}` : `translation missing: ${localized.lang}`;
  return `<button id="translate-page" class="chip stale" data-page="${page.path}" data-lang="${localized.lang}">🌐 ${text}</button>`;
}

async function route() {
  const hash = location.hash.slice(1) || firstPageKey();
  const page = FLAT[hash];
  if (hash === 'console') {
    document.querySelectorAll('#sidebar a').forEach(a => a.classList.remove('active'));
    renderConsolePage();
    document.getElementById('main').scrollTop = 0;   // 仅导航时回顶；操作读回的重渲染保留滚动位
    return;
  }
  document.querySelectorAll('#sidebar a').forEach(a =>
    a.classList.toggle('active', a.dataset.key === hash));
  if (!page) {
    document.getElementById('meta').innerHTML = '';
    document.getElementById('content').innerHTML = `<h1>404</h1><p>无此页：<code>${hash}</code></p>`;
    return;
  }
  const localized = resolveLocalizedPage(page, SELECTED_LANG);
  const raw = await (await fetch(BASE + 'wiki/' + localized.path, { cache: 'no-store' })).text();   // python serve 的启发式缓存会吃掉刚 finalize 的新内容
  const html = preprocessWikilinks(renderMarkdown(stripFrontmatter(raw)), PAGE_INDEX);
  document.getElementById('meta').innerHTML = renderMeta(page) + renderTranslateState(page, localized);
  document.getElementById('content').innerHTML = html;
  const mNodes = document.querySelectorAll('#content .mermaid');
  if (mNodes.length) {
    const tNow = document.documentElement.getAttribute('data-theme');
    mNodes.forEach(div => { if (div.dataset.src == null) div.dataset.src = div.textContent; div.textContent = themedSrc(div.dataset.src, tNow); });   // 存纯源码 + 注入当前主题指令再渲染
    try { await ensureMermaid(); await window.mermaid.run({ nodes: mNodes }); }
    catch { /* missing asset or bad diagram: leave source text visible, page stays usable */ }
    mNodes.forEach(div => { if (div.querySelector('svg')) div.onclick = () => LB.open(div); });
  }
  const translateBtn = document.getElementById('translate-page');
  if (translateBtn) {
    translateBtn.onclick = async () => {
      translateBtn.disabled = true;
      translateBtn.textContent = '🌐 translation requested';
      try {
        await fetch(BASE + 'api/translation-requests', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ page: translateBtn.dataset.page, target_lang: translateBtn.dataset.lang }),
        });
      } catch {
        translateBtn.textContent = `run: node lib/translate.js plan .lore ${translateBtn.dataset.page} ${translateBtn.dataset.lang}`;
      }
    };
  }
  document.getElementById('main').scrollTop = 0;
}

const RO_ATTR = 'disabled title="只读模式（portal 或 python server）——本地 /lore:serve --node 可操作"';

function renderConsolePage() {
  const m = buildConsoleModel(MANIFEST, SYNC_STATUS);
  const modeDesc = { manual: '一切手动——commit 不触发任何后台动作', notify: 'commit 后自动机械刷新（决策史/manifest/stale），prose 重写排队提醒' };
  const rows = m.stalePages.map(p => `
    <tr><td><a href="#${p.key}">${p.key}</a></td>
      <td><span class="tag w">⚠ ${p.stale} commits</span></td>
      <td>${p.last_updated || '—'}</td>
      <td>${QUEUED_PAGES.has(p.path)
        ? '<span class="tag q">已排队 ✓</span>'
        : `<button data-queue="${p.path}" ${SYNC_API_OK ? '' : RO_ATTR}>✍ 排队</button>`}</td></tr>`).join('');
  document.getElementById('meta').innerHTML = '';
  document.getElementById('content').innerHTML = `
    <h1>⚙ 同步控制台</h1>
    <div class="console-sec">
      <h3>档位</h3>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span class="seg" id="console-seg">
          <button data-mode="manual" ${SYNC_API_OK ? '' : RO_ATTR}>手动</button>
          <button data-mode="notify" ${SYNC_API_OK ? '' : RO_ATTR}>提醒</button>
          <button data-mode="auto" disabled title="B2 解锁">全自动 🔒</button>
        </span>
        <span style="color:var(--fg-dim);font-size:12.5px">${modeDesc[m.mode] ?? ''}</span>
      </div>
    </div>
    <div class="console-sec">
      <h3>待重写队列（manifest stale &gt; 0）</h3>
      ${m.staleTotal ? `<table><tr><th>页面</th><th>落后</th><th>正文最后重写</th><th></th></tr>${rows}</table>` : '<p style="color:var(--fg-dim)">全部新鲜 ✓</p>'}
      <div style="margin-top:10px">
        <button id="console-queue-all" ${SYNC_API_OK && m.staleTotal ? '' : (SYNC_API_OK ? 'disabled' : RO_ATTR)}>✍ 全部排队</button>
        <button id="console-finalize" ${SYNC_API_OK ? '' : RO_ATTR}>⟳ 立即机械刷新</button>
      </div>
    </div>
    <div class="console-sec">
      <h3>状态</h3>
      <table>
        <tr><td style="color:var(--fg-dim)">上次机械刷新</td><td>${m.lastFinalize ? new Date(m.lastFinalize).toLocaleString() : '—'}</td></tr>
        <tr><td style="color:var(--fg-dim)">已排队请求</td><td>${QUEUED_PAGES.size} 条 —— 下次会话 /lore:sync 优先消化</td></tr>
        <tr><td style="color:var(--fg-dim);opacity:.55">自动重写任务历史</td><td style="opacity:.55">🔒 B2 全自动档解锁后显示</td></tr>
      </table>
    </div>`;
  document.querySelectorAll('#console-seg button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === m.mode);
    if (b.dataset.mode !== 'auto') b.onclick = async () => {
      try {
        await fetch(BASE + 'api/sync/mode', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mode: b.dataset.mode }) });
      } catch {}
      await fetchSyncStatus(); renderSyncLight(); renderConsolePage();   // 失败也读回真值（统一失败语义）
    };
  });
  document.querySelectorAll('#content button[data-queue]').forEach(b => b.onclick = async () => {
    try {
      await fetch(BASE + 'api/sync/rewrite-requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ page: b.dataset.queue }) });
    } catch {}
    await fetchSyncStatus(); renderSyncLight(); renderConsolePage();
  });
  const qa = document.getElementById('console-queue-all');
  if (qa) qa.onclick = async () => {
    for (const p of m.stalePages) if (p.path && !QUEUED_PAGES.has(p.path)) {
      try { await fetch(BASE + 'api/sync/rewrite-requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ page: p.path }) }); } catch {}
    }
    await fetchSyncStatus(); renderSyncLight(); renderConsolePage();
  };
  const fz = document.getElementById('console-finalize');
  if (fz) fz.onclick = async () => {
    try { await fetch(BASE + 'api/sync/finalize', { method: 'POST' }); startFastPoll(); }
    catch { await fetchSyncStatus(); renderSyncLight(); renderConsolePage(); }   // server 挂了 → 降级态亮出（与面板同语义）
  };
}

function firstPageKey() {
  for (const ax of MANIFEST.axes) if (ax.pages[0]) return `${ax.id}/${ax.pages[0].id}`;
  return '';
}

function wireSearch() {
  document.getElementById('q').addEventListener('input', e => {
    const term = e.target.value.toLowerCase().trim();
    document.getElementById('sidebar').classList.toggle('searching', !!term);   // 搜索穿透折叠组

    document.querySelectorAll('#sidebar .links a').forEach(a =>
      a.classList.toggle('hidden', term && !a.dataset.search.includes(term)));
    document.querySelectorAll('.axis').forEach(ax => {
      const any = [...ax.querySelectorAll('a')].some(a => !a.classList.contains('hidden'));
      ax.style.display = any ? '' : 'none';
    });
  });
}

function wireTheme() {
  const sel = document.getElementById('theme');
  const saved = localStorage.getItem('lore-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  sel.value = saved;
  sel.addEventListener('change', () => {
    document.documentElement.setAttribute('data-theme', sel.value);
    localStorage.setItem('lore-theme', sel.value);
    if (mermaidLoad) {   // mermaid already on this page → re-theme + re-render its diagrams
      window.mermaid?.initialize({ startOnLoad: false, securityLevel: 'strict', theme: mapMermaidTheme(sel.value) });
      route();
    }
  });
}

// --- B1 同步控制台（spec 2026-06-09-lore-sync-console）---
let SYNC_STATUS = null;        // GET /api/sync/status 结果；API 不可用（python/portal）→ null
let SYNC_API_OK = false;
let QUEUED_PAGES = new Set();  // 已排队 page path（渲染「已排队 ✓」）

async function fetchSyncStatus() {
  try {
    const r = await fetch(BASE + 'api/sync/status');
    if (!r.ok) throw new Error();
    SYNC_STATUS = await r.json();
    SYNC_API_OK = true;
    const q = await (await fetch(BASE + 'api/sync/rewrite-requests')).json();
    QUEUED_PAGES = new Set((q.requests ?? []).map(x => x.page));
  } catch { SYNC_STATUS = null; SYNC_API_OK = false; }
}

// --- manifest 轮询：15s 慢轮询常驻；操作后 1s×10 快轮询（秒级反馈）。纯 GET，三 serve 形态全兼容。
let LAST_GENERATED = null, POLL_TIMER = null, FAST_LEFT = 0;

async function pollTick() {
  if (document.hidden) return;                                   // 后台 tab 不空转
  let fresh;
  try { fresh = await (await fetch(BASE + 'wiki/.manifest.json', { cache: 'no-store' })).json(); }   // 绕过 python serve 启发式缓存
  catch { return; }
  const currentKey = location.hash.slice(1) || firstPageKey();   // 与 route 对齐：落地页（无 hash）也能出提示条
  const before = JSON.stringify(FLAT[currentKey] ?? null);
  const flatNew = {};
  for (const ax of fresh.axes) for (const p of ax.pages) flatNew[`${ax.id}/${p.id}`] = p;
  const d = pollDecide(LAST_GENERATED, fresh.generated, JSON.stringify(flatNew[currentKey] ?? null) !== before);
  LAST_GENERATED = fresh.generated;
  if (!d.changed) return;
  MANIFEST = fresh; PAGE_INDEX = buildPageIndex(MANIFEST); FLAT = flatNew;
  if (d.rebuildSidebar) {
    buildSidebar();   // 全量重建 → 把瞬态 UI 状态接回来：active 高亮 + 搜索过滤
    const hash = location.hash.slice(1) || firstPageKey();
    document.querySelectorAll('#sidebar a').forEach(a => a.classList.toggle('active', a.dataset.key === hash));
    const q = document.getElementById('q');
    if (q.value.trim()) q.dispatchEvent(new Event('input'));
  }
  await fetchSyncStatus(); renderSyncLight();
  if (location.hash.slice(1) === 'console') renderConsolePage();
  if (d.showUpdateBar) showUpdateBar();
  if (FAST_LEFT > 0) { FAST_LEFT = 0; schedulePoll(15000); }     // 快轮询命中 → 回落慢轮询
}

function schedulePoll(ms) {
  clearInterval(POLL_TIMER);
  POLL_TIMER = setInterval(async () => {
    await pollTick();
    if (FAST_LEFT > 0 && --FAST_LEFT === 0) schedulePoll(15000); // 快轮询用尽未命中 → 回落
  }, ms);
}

function startFastPoll() { FAST_LEFT = 10; schedulePoll(1000); }

function showUpdateBar() {
  if (document.getElementById('update-bar')) return;
  const bar = document.createElement('div');
  bar.id = 'update-bar';
  bar.textContent = '⟳ 内容已更新，点击刷新本页';
  bar.onclick = () => { bar.remove(); route(); };
  document.getElementById('content').prepend(bar);
}

function renderSyncLight() {
  const m = buildConsoleModel(MANIFEST, SYNC_STATUS);
  const light = document.getElementById('sync-light');
  light.className = m.light === 'fresh' ? '' : m.light;          // '' | 'stale' | 'off'
  document.getElementById('sync-light-text').textContent =
    m.light === 'off' ? `手动 · ${m.staleTotal} 待写`
    : m.staleTotal ? `${m.staleTotal} 待重写` : '全新鲜';
  document.querySelectorAll('#sync-panel .seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === m.mode));
  document.getElementById('sync-stale-summary').textContent = m.staleTotal
    ? m.stalePages.slice(0, 2).map(p => `${p.key.split('/').pop()} ⚠${p.stale}`).join(' · ') + (m.staleTotal > 2 ? ` 等${m.staleTotal}页` : '')
    : '无';
  document.getElementById('sync-last').textContent = m.lastFinalize
    ? new Date(m.lastFinalize).toLocaleString() : '—';
  for (const id of ['sync-finalize', 'sync-queue-all']) {
    const btn = document.getElementById(id);
    btn.disabled = !SYNC_API_OK;
    btn.title = SYNC_API_OK ? '' : '只读模式（portal 或 python server）——本地 /lore:serve --node 可操作';
  }
  document.querySelectorAll('#sync-panel .seg button:not([data-mode="auto"])').forEach(b => {
    b.disabled = !SYNC_API_OK;
    b.title = SYNC_API_OK ? '' : '只读模式';
  });
}

function wireSyncConsole() {
  const light = document.getElementById('sync-light');
  const panel = document.getElementById('sync-panel');
  light.onclick = () => { panel.hidden = !panel.hidden; };
  document.addEventListener('click', e => {
    if (!panel.hidden && !panel.contains(e.target) && !light.contains(e.target)) panel.hidden = true;
  });
  document.querySelectorAll('#sync-panel .seg button[data-mode]').forEach(b => {
    if (b.dataset.mode === 'auto') return;                       // B2
    b.onclick = async () => {
      try {
        await fetch(BASE + 'api/sync/mode', { method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ mode: b.dataset.mode }) });
      } catch { /* 失败也读回真值 */ }
      await fetchSyncStatus(); renderSyncLight();              // 读回显示（硬约束②：存→读全链路）
    };
  });
  document.getElementById('sync-finalize').onclick = async () => {
    try {
      await fetch(BASE + 'api/sync/finalize', { method: 'POST' });
      startFastPoll();                                           // 快轮询秒级反馈
    } catch { await fetchSyncStatus(); renderSyncLight(); }      // server 挂了 → 降级态自然亮出
  };
  document.getElementById('sync-queue-all').onclick = async () => {
    const m = buildConsoleModel(MANIFEST, SYNC_STATUS);
    for (const p of m.stalePages) {
      if (p.path && !QUEUED_PAGES.has(p.path)) {
        try { await fetch(BASE + 'api/sync/rewrite-requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ page: p.path }) }); } catch {}
      }
    }
    await fetchSyncStatus(); renderSyncLight();
  };
  document.getElementById('sync-detail').onclick = () => { panel.hidden = true; location.hash = 'console'; };
}

const LB = (() => {
  const lb = document.getElementById('lb'), stage = document.getElementById('lb-stage');
  let svg = null, scale = 1, tx = 0, ty = 0, drag = null;
  const apply = () => { if (svg) svg.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`; };
  const open = async (div) => {
    await ensureMermaid();   // 按当前壳主题重新渲染这张图（init 指令跟主题，绕过全局缓存）
    let out;
    try { ({ svg: out } = await window.mermaid.render('lbR' + Date.now(), themedSrc(div.dataset.src, document.documentElement.getAttribute('data-theme')))); }
    catch { out = div.innerHTML; }   // 源码缺失/坏图 → 退回克隆已渲染的
    stage.innerHTML = out; svg = stage.querySelector('svg');   // 保留 render 的 svg id：mermaid 的 <style> scoped 到该 id，删了主题样式全失配→节点变默认黑
    scale = 1; tx = 0; ty = 0; apply(); lb.classList.add('open');
  };
  const close = () => { lb.classList.remove('open'); stage.innerHTML = ''; svg = null; };
  const zoom = (f, cx, cy) => {                              // 以 (cx,cy) 为锚缩放
    const ns = Math.min(8, Math.max(0.2, scale * f));
    if (cx != null) { const r = stage.getBoundingClientRect(); const ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2;
      tx = ox - (ox - tx) * (ns / scale); ty = oy - (oy - ty) * (ns / scale); }
    scale = ns; apply();
  };
  document.getElementById('lb-in').onclick = () => zoom(1.25);
  document.getElementById('lb-out').onclick = () => zoom(0.8);
  document.getElementById('lb-reset').onclick = () => { scale = 1; tx = 0; ty = 0; apply(); };
  document.getElementById('lb-close').onclick = close;
  lb.onclick = e => { if (e.target === lb || e.target === stage) close(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('open')) close(); });
  stage.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : 0.89, e.clientX, e.clientY); }, { passive: false });
  stage.addEventListener('pointerdown', e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
  stage.addEventListener('pointerup', e => { drag = null; stage.classList.remove('dragging'); stage.releasePointerCapture(e.pointerId); });
  return { open };
})();

boot();
