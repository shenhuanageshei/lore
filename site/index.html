<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lore wiki</title>
<style>
  /* ===== 设计 tokens（设计 §5.2，逐值固定——改一个值就是改了整套视觉语言）===== */
  :root {
    --bg:#F4F6F9;     /* 画布 */
    --pan:#FFFFFF;    /* 面板 */
    --pan2:#F8FAFC;   /* 次级 */
    --bd:#E2E7EE;     /* 边框 */
    --bd2:#CFD7E2;    /* 强调边框 */
    --fg:#0F1319;     /* 正文 */
    --mut:#5B6473;    /* 次要（5.97:1） */
    --dim:#6B7280;    /* 弱（4.83:1，达标 ≥4.5:1；不得回退 #8A94A3） */
    --acc:#5B5BD6;    /* 主色 */
    --acc2:#0E7490;   /* 副色 */
    --amber:#B45309;  /* 陈旧 */
    --ok:#15803D;     /* 成功 */
    --bad:#DC2626;    /* 危险 */
    /* D1：字体只用字体栈，绝不 @import / CDN——本机装了就用，没装就降级，不因字体缺失破版。 */
    --font:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 24px 48px -28px rgba(16,24,40,.22);
    --shadow-1:0 1px 2px rgba(16,24,40,.05);
    color-scheme:light;
    /* 旧变量名 → 新 token 角色：壳里 615 行脚本仍按旧名写内联样式（var(--fg-dim)/var(--panel)/…），
       别名一旦删掉，控制台与表单会静默褪色（不是重构，是破坏）。 */
    --panel:var(--pan); --sidebar:var(--pan2); --border:var(--bd); --accent:var(--acc);
    --accent-dim:var(--bd2); --fg-dim:var(--dim); --fg-bright:var(--fg);
    --warn:var(--amber); --green:var(--ok); --yellow:var(--amber); --red:var(--bad);
    --code-bg:var(--pan2); --comp:var(--acc); --flow:var(--acc2); --theme:var(--amber); --docs:var(--ok);
  }
  /* D10：dark / sepia 保留既有色值，只重映射到上面的角色名——本期只保证不破版，不做对比度重校
     （浅色才是 §5.2 的校色对象）。--dim 与 --mut 同值：旧调色板只有一个次级灰阶，不新造色值。 */
  :root[data-theme="dark"] {
    --bg:#1a1b26; --pan:#1f2130; --pan2:#16161e; --bd:#2a2e42; --bd2:#3d59a1;
    --fg:#c0caf5; --mut:#565f89; --dim:#565f89;
    --acc:#7aa2f7; --acc2:#7dcfff; --amber:#e0af68; --ok:#9ece6a; --bad:#f7768e;
    color-scheme:dark;
  }
  :root[data-theme="sepia"] {
    --bg:#f4ecd8; --pan:#e7dcc0; --pan2:#ece2c8; --bd:#d9c9a3; --bd2:#cdb892;
    --fg:#5b4636; --mut:#9c8b73; --dim:#9c8b73;
    --acc:#9a6a3a; --acc2:#7a6a3a; --amber:#9a6a20; --ok:#6b7536; --bad:#a8443a;
    color-scheme:light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13.5px/1.66 var(--font); background: var(--bg); color: var(--fg);
    height: 100vh; overflow: hidden; -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--bd2); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .hidden { display: none; }

  /* ===== 布局（设计 §5.3）：快捷键栏 / 品牌行 · 三列 · 状态行 ===== */
  #app { display: grid; grid-template-columns: 264px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto; height: 100vh; }
  /* 检查器（阶段 C 起有内容）出现时才让出第三列——空着不占宽度 */
  #app:has(#inspector:not([hidden])) { grid-template-columns: 264px minmax(0, 1fr) 268px; }

  /* ---- 顶栏 ① 快捷键栏 ---- */
  #topbar { grid-column: 1 / -1; grid-row: 1; position: relative; z-index: 20;
    display: flex; flex-direction: column; background: var(--pan); border-bottom: 1px solid var(--bd); }
  #fkeys { display: flex; align-items: center; gap: 3px; flex-wrap: wrap;
    padding: 6px 16px; background: var(--pan2); border-bottom: 1px solid var(--bd); }
  .fkey { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font: 500 11px/1 var(--mono); padding: 7px 9px; border-radius: 8px;
    border: 1px solid var(--bd); background: var(--pan); color: var(--mut);
    transition: transform 180ms var(--ease); }
  .fkey i { font-style: normal; color: var(--acc); }
  .fkey:hover:not(:disabled) { border-color: var(--bd2); color: var(--fg); transform: translateY(-1px); }
  .fkey:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  /* 无内容的键保持 disabled：静态 HTML 里恒在（D9 无 JS 外壳非空白），但绝不注册成死键（D8） */
  .fkey:disabled { cursor: default; color: var(--dim); opacity: .62; background: transparent; border-style: dashed; }
  .fkey:disabled i { color: var(--dim); }

  /* ---- 顶栏 ② 品牌 · 搜索 · 重写 · 收纳（主题/语言/sync 灯）---- */
  #topbar-main { position: relative; display: flex; align-items: center; gap: 14px;
    padding: 9px 16px; flex-wrap: wrap; }
  #brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.02em; color: var(--fg); }
  #brand::before { content: "◆"; display: grid; place-items: center; width: 24px; height: 24px;
    border-radius: 8px; font-size: 11px; color: #fff;
    background: linear-gradient(140deg, var(--acc), var(--acc2)); }
  #brand .dim { font: 400 11.5px/1 var(--mono); color: var(--dim); font-weight: 400; }
  #search { flex: 1; min-width: 150px; max-width: 360px; }
  #search input { width: 100%; padding: 8px 12px; border-radius: 10px; font: 400 12px/1.4 var(--font);
    background: var(--pan); border: 1px solid var(--bd); color: var(--fg); box-shadow: var(--shadow-1) inset; }
  #search input::placeholder { color: var(--dim); }
  #search input:focus { outline: 2px solid color-mix(in srgb, var(--acc) 32%, transparent);
    outline-offset: 1px; border-color: var(--acc); }
  #rewrite-page { padding: 8px 12px; border-radius: 10px; cursor: pointer;
    font: 500 11.5px/1 var(--font); border: 1px solid transparent; color: #fff;
    background: linear-gradient(140deg, var(--acc), color-mix(in srgb, var(--acc2) 45%, var(--acc)));
    transition: transform 180ms var(--ease); }
  #rewrite-page:hover:not(:disabled) { transform: translateY(-1px); }
  #rewrite-page:active:not(:disabled) { transform: scale(.975); }
  #rewrite-page:disabled { background: none; border-color: var(--bd); color: var(--dim); cursor: default; }
  #topbar-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #theme, #language, #repo-switch { background: var(--pan); border: 1px solid var(--bd); color: var(--mut);
    padding: 7px 9px; border-radius: 10px; font: 500 11.5px/1 var(--font); cursor: pointer; }
  #theme:hover, #language:hover, #repo-switch:hover { border-color: var(--bd2); color: var(--fg); }
  #theme:focus-visible, #language:focus-visible, #repo-switch:focus-visible {
    outline: 2px solid var(--acc); outline-offset: 1px; border-color: var(--acc); }
  #portal-home { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px;
    color: var(--mut); text-decoration: none; background: var(--pan); border: 1px solid var(--bd); font-size: 13px; }
  #portal-home:hover { border-color: var(--bd2); color: var(--fg); }
  #sync-light { display: flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 12px;
    border: 1px solid var(--bd); background: var(--pan); color: var(--mut);
    cursor: pointer; user-select: none; white-space: nowrap; font: 400 11px/1 var(--mono); }
  #sync-light:hover { border-color: var(--bd2); color: var(--fg); }
  #sync-light .ind { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #sync-light.stale .ind { background: var(--amber); }
  #sync-light.off .ind { background: var(--dim); }
  #sync-light.busy .ind { background: var(--acc); animation: lb-pulse 1.2s infinite; }
  @keyframes lb-pulse { 50% { opacity: .35; } }
  /* 收纳组里的弹出面板：锚在顶栏下沿（顶栏高度由内容决定，不写死像素） */
  #sync-panel { position: absolute; top: calc(100% + 8px); right: 16px; z-index: 50; width: 300px;
    background: var(--pan); border: 1px solid var(--bd2); border-radius: 12px;
    padding: 12px 14px; box-shadow: var(--shadow); font-size: 12.5px; color: var(--fg); }
  #sync-panel .row { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; gap: 8px; }
  #sync-panel .dim { color: var(--dim); }
  .seg { display: inline-flex; border: 1px solid var(--bd); border-radius: 8px; overflow: hidden; }
  .seg button { background: none; border: none; padding: 4px 10px; cursor: pointer;
    color: var(--fg); font: 400 12px/1.4 var(--font); }
  .seg button.on { background: var(--acc); color: #fff; font-weight: 600; }
  .seg button:disabled { color: var(--dim); cursor: not-allowed; opacity: .6; }
  #sync-panel .actions button { background: var(--pan2); border: 1px solid var(--bd); border-radius: 8px;
    padding: 5px 10px; margin-right: 6px; margin-top: 8px; cursor: pointer; color: var(--fg);
    font: 400 12px/1.4 var(--font); }
  #sync-panel .actions button:hover:not(:disabled) { border-color: var(--acc); color: var(--acc); }
  #sync-panel .actions button:disabled { color: var(--dim); cursor: not-allowed; opacity: .6; }
  #sync-panel[hidden] { display: none; }
  .console-sec { background: var(--pan); border: 1px solid var(--bd); border-radius: 12px;
    padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow-1); }
  .console-sec h3 { margin: 0 0 10px; color: var(--fg); font-size: 15px; }
  .console-sec table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .console-sec th { text-align: left; color: var(--dim); font: 500 10px/1.4 var(--mono);
    text-transform: uppercase; letter-spacing: .12em; padding: 5px 8px; border-bottom: 1px solid var(--bd); }
  .console-sec td { padding: 7px 8px; border-bottom: 1px solid var(--bd); }
  .console-sec .tag { padding: 2px 8px; border-radius: 12px; font-size: 11px; }
  .console-sec .tag.w { background: color-mix(in srgb, var(--amber) 12%, transparent); color: var(--amber); }
  .console-sec .tag.q { background: color-mix(in srgb, var(--acc) 10%, transparent); color: var(--acc); }
  .console-sec button { background: var(--pan2); border: 1px solid var(--bd); border-radius: 8px;
    padding: 4px 10px; cursor: pointer; color: var(--fg); font-size: 12px; }
  .console-sec button:hover:not(:disabled) { border-color: var(--acc); color: var(--acc); }
  .console-sec button:disabled { color: var(--dim); cursor: not-allowed; opacity: .6; }
  #update-bar { background: color-mix(in srgb, var(--acc) 8%, transparent); border: 1px solid color-mix(in srgb, var(--acc) 30%, transparent);
    border-radius: 10px; padding: 8px 14px; margin-bottom: 14px; cursor: pointer; color: var(--fg); font-size: 13px; }
  #update-bar:hover { border-color: var(--acc); color: var(--acc); }

  /* ---- 目录树列 ---- */
  #sidebar { grid-column: 1; grid-row: 2; background: var(--pan2); border-right: 1px solid var(--bd);
    overflow-y: auto; padding: 14px 0; }
  .axis { margin-bottom: 6px; }
  .axis-h { display: flex; align-items: center; gap: 7px; padding: 7px 14px 5px;
    font: 500 10px/1.4 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--dim);
    cursor: pointer; user-select: none; }
  .axis-h .dot { width: 7px; height: 7px; border-radius: 50%; }
  .axis-h .caret { margin-left: auto; font-size: 9px; transition: transform 180ms var(--ease); }
  .axis.collapsed .caret { transform: rotate(-90deg); }
  .axis.collapsed .links { display: none; }
  .dot.component { background: var(--acc); }
  .dot.flow { background: var(--acc2); }
  .dot.theme { background: var(--amber); }
  .theme-children { padding-left: 12px; border-left: 1px solid var(--bd); margin: 2px 0 6px; }
  .dot.docs { background: var(--ok); }
  .dot.index { background: var(--dim); }
  .dot.HOME { background: var(--acc); }
  .dot.INDEX { background: var(--dim); }
  .links a { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px 14px 6px 26px;
    color: var(--fg); text-decoration: none; font-size: 12.5px; border-left: 2px solid transparent;
    border-radius: 0 8px 8px 0; }
  .links a:hover { background: color-mix(in srgb, var(--acc) 6%, transparent); }
  .links a.active { background: color-mix(in srgb, var(--acc) 10%, transparent);
    border-left-color: var(--acc); color: var(--acc); font-weight: 500; }
  .links a .stale { margin-left: auto; font: 500 10px/1 var(--mono); color: var(--amber); }
  .links a .when { flex-basis: 100%; font: 400 10px/1.4 var(--mono); color: var(--dim); }
  .links a.hidden { display: none; }
  .links .grp { padding: 6px 14px 2px 26px; font: 500 9.5px/1.4 var(--mono); letter-spacing: .12em;
    color: var(--dim); text-transform: uppercase; }
  .grp-toggle { cursor: pointer; user-select: none; }
  .grp-toggle:hover { color: var(--fg); }
  .grp-toggle .caret { display: inline-block; width: 10px; font-size: 9px; }
  .dgrp.closed .grp-rows { display: none; }
  #sidebar.searching .dgrp .grp-rows { display: block; }   /* 搜索穿透：临时展开全部组 */
  #sidebar.searching .grp-toggle { display: none; }        /* 搜索态平铺命中行，组头让位 */
  .plan-badge { display: inline-block; padding: 1px 7px; border-radius: 12px; font-size: 10px;
    border: 1px solid var(--bd2); color: var(--acc); margin-left: 6px; cursor: pointer; }
  .plan-badge:hover { border-color: var(--acc); background: var(--pan); }
  #cross-hits { border-top: 1px dashed var(--bd2); margin-top: 10px; padding-top: 4px; }
  #cross-hits a { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 26px;
    color: var(--fg); text-decoration: none; font-size: 12.5px; }
  #cross-hits a:hover { background: color-mix(in srgb, var(--acc) 6%, transparent); }
  .cross-repo { padding: 1px 7px; border-radius: 12px; font-size: 10px;
    border: 1px solid var(--bd); color: var(--dim); white-space: nowrap; }

  /* ---- 正文列（D11：ch 定宽 ≤76ch）---- */
  #main { grid-column: 2; grid-row: 2; overflow-y: auto; padding: 0; }
  #meta { background: var(--pan); border-bottom: 1px solid var(--bd); box-sizing: border-box;
    padding: 11px 40px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; align-items: center;
    max-width: calc(76ch + 80px); margin: 0 auto; }
  #meta .chip { display: flex; align-items: center; gap: 6px; color: var(--mut);
    font: 500 10.5px/1 var(--mono); letter-spacing: .04em; }
  #meta .chip b { color: var(--fg); font-weight: 500; }
  #meta .chip.stale { color: var(--amber); }
  #meta .chip.fresh { color: var(--ok); }
  #meta button.chip { font: inherit; cursor: pointer; border: 1px solid currentColor;
    background: transparent; border-radius: 8px; padding: 3px 8px; }
  #meta button.chip:hover { background: color-mix(in srgb, currentColor 10%, transparent); }
  #content { padding: 30px 40px 80px; max-width: 76ch; margin: 0 auto; }
  #content h1 { font-size: clamp(23px, 2.6vw, 29px); line-height: 1.2; letter-spacing: -.02em;
    color: var(--fg); margin: 8px 0 18px; padding-bottom: 10px; border-bottom: 1px solid var(--bd); }
  #content h2 { font-size: 13px; font-weight: 600; color: var(--fg); margin: 32px 0 12px;
    display: flex; align-items: center; gap: 10px; }
  #content h2::after { content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, var(--bd), transparent); }
  #content h3 { font-size: 15px; color: var(--fg); margin: 22px 0 8px; }
  #content p { margin: 10px 0; }
  #content ul, #content ol { margin: 10px 0 10px 24px; }
  #content li { margin: 4px 0; }
  #content code { background: color-mix(in srgb, var(--acc) 7%, transparent);
    border: 1px solid color-mix(in srgb, var(--acc) 15%, transparent); padding: 1px 6px; border-radius: 8px;
    font-family: var(--mono); font-size: 11.5px; color: var(--fg); }
  #content pre { background: var(--pan2); padding: 14px 16px; border-radius: 12px; overflow-x: auto;
    margin: 12px 0; border: 1px solid var(--bd); }
  #content pre code { background: none; border: none; padding: 0; color: var(--fg); font-size: 12px; }
  #content a { color: var(--acc); text-decoration: none; border-bottom: 1px solid var(--bd2); }
  #content a:hover { border-bottom-color: var(--acc); }
  #content a.wikilink { color: var(--acc2); border-bottom-color: transparent;
    background: color-mix(in srgb, var(--acc2) 10%, transparent); padding: 1px 7px; border-radius: 8px; }
  #content a.wikilink::before { content: "🔗 "; font-size: 11px; }
  #content blockquote { border-left: 3px solid var(--acc2); padding: 5px 16px; margin: 12px 0;
    color: var(--mut); background: color-mix(in srgb, var(--acc2) 5%, transparent); border-radius: 0 10px 10px 0; }
  #content table { border-collapse: collapse; margin: 14px 0; width: 100%; font-size: 12.5px; }
  #content th, #content td { border: 1px solid var(--bd); padding: 7px 12px; text-align: left; }
  #content th { background: var(--pan2); color: var(--fg); font-weight: 600; }
  #content hr { border: none; border-top: 1px solid var(--bd); margin: 22px 0; }
  .tl { border-left: 1px solid var(--bd2); padding-left: 18px; margin: 14px 0; }
  .tl-item { position: relative; margin: 16px 0; }
  .tl-item::before { content: ""; position: absolute; left: -23px; top: 6px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--acc); }
  .tl-item .when { font: 400 10.5px/1.4 var(--mono); color: var(--dim); }
  .tl-item .badge { font-size: 10px; padding: 1px 7px; border-radius: 12px; margin-left: 6px; }
  .badge.extracted { background: color-mix(in srgb, var(--ok) 12%, transparent); color: var(--ok); }
  .badge.inferred { background: color-mix(in srgb, var(--amber) 12%, transparent); color: var(--amber); }
  #content .mermaid { cursor: zoom-in; }

  /* ---- 检查器列（§5.4 引出线注记；阶段 C 起有内容，空着则 hidden 不占位）---- */
  #inspector { grid-column: 3; grid-row: 2; overflow-y: auto; background: var(--pan2);
    border-left: 1px solid var(--bd); padding: 18px 14px; display: grid; gap: 12px; align-content: start; }
  #inspector[hidden] { display: none; }

  /* ---- 阶段 C 视觉①：引出线注记（正文角标 ↔ 右栏注记，设计 §5.4）---- */
  /* 角标（引出线的正文端）：renderAnchors 产出的 <sup class="anchor-ref">，点它高亮右栏对应注记 */
  #content .anchor-ref { font: 500 10px/1 var(--mono); color: var(--acc); cursor: pointer;
    margin-left: 2px; padding: 1px 5px; border-radius: 8px;
    background: color-mix(in srgb, var(--acc) 12%, transparent); }
  #content .anchor-ref:hover { background: color-mix(in srgb, var(--acc) 24%, transparent); }
  #content .anchor-ref:focus-visible { outline: 2px solid var(--acc); outline-offset: 1px; }
  /* 注记（引出线的右栏端）：一条一块，编号 = 正文出现顺序；anchor 原样显示（D7：不重解析、不改行号） */
  #inspector .insp-title { font: 500 10px/1.4 var(--mono); text-transform: uppercase;
    letter-spacing: .12em; color: var(--dim); }
  #inspector .note { display: grid; gap: 5px; padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--bd); background: var(--pan);
    transition: transform 200ms var(--ease), opacity 200ms var(--ease); }
  #inspector .note-n { font: 500 10.5px/1 var(--mono); color: var(--acc); }
  /* D15：文件级锚点（源未给行号）的显式标注。文件级锚点的确定性**低于**行级锚点，必须看得见——
     渲染成一样就是伪造确定性（不变量⑧）。用既有 weak/amber token 与既有 10.5px mono 刻度，不新增字号档。 */
  #inspector .note-src { font: 500 10.5px/1 var(--mono); color: var(--amber); }
  #inspector .note-anchor { font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
    color: var(--fg); word-break: break-all; }
  /* 点角标 → 高亮（验收 ③）：换色瞬时生效，transition 只挂 transform/opacity（§5.2「只动 transform/opacity」） */
  #inspector .note.flash { border-color: var(--acc); transform: translateX(3px);
    background: color-mix(in srgb, var(--acc) 9%, transparent); }

  /* ---- 阶段 C 视觉②：决策史 = 修改记录表（设计 §5.4 / D6）---- */
  /* 版本 / 日期是读数 → JetBrains Mono（§5.2 的字体分工）。class 由 route() 精确打在决策史那张表上，
     不用文字启发式，别的表格不连坐。 */
  #content .journal-table td:first-child, #content .journal-table td:nth-child(2) {
    font-family: var(--mono); font-size: 11.5px; color: var(--mut); white-space: nowrap; }
  #content .journal-table .dh-ver { color: var(--acc); }

  /* ---- 底部状态行（§5.3 / §5.5：可操作 + 燃料读数；D9：无 JS 时静态读数不空白）---- */
  #statusline { grid-column: 1 / -1; grid-row: 3; display: flex; align-items: center; gap: 16px;
    flex-wrap: wrap; padding: 9px 16px; background: var(--pan); border-top: 1px solid var(--bd);
    font: 400 10.5px/1 var(--mono); letter-spacing: .06em; color: var(--dim); }
  #statusline b { color: var(--fg); font-weight: 500; }
  #statusline .live { display: inline-flex; align-items: center; gap: 6px; color: var(--ok); }
  /* 状态行的「live」呼吸点：**刻意不走 §5.2 的 150–300ms 动效档**，留痕说明理由——
     那一档说的是「一次状态变化的过渡」时长（transition 的一次性动作），而这里是**常驻**状态指示灯：
     300ms 的无限循环是频闪（光敏性癫痫风险），不是动效，对齐它反而违反 §5.2 的另外两条
     （「只动 opacity」「尊重 prefers-reduced-motion」）。
     2.4s 沿用既有的 lb-pulse 关键帧（纯 opacity、不触发布局），与 #sync-light.busy 的 1.2s 同族——
     读数灯的时间语言一致，不新造曲线；prefers-reduced-motion: reduce 时由下方媒体查询全局关停。 */
  #statusline .live::before { content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--ok); animation: lb-pulse 2.4s infinite; }
  #statusline .cap-none { color: var(--amber); }
  #statusline .cap-unknown { color: var(--dim); }
  #statusline .warn { color: var(--amber); }
  #statusline .budget { color: var(--bad); }
  /* 「队列 N」是**可操作**读数（§5.5 硬项）：点开既有 sync 面板，不是装饰遥测 */
  #statusline .queue { font: inherit; letter-spacing: inherit; background: none; cursor: pointer;
    border: 1px solid transparent; border-radius: 8px; padding: 4px 8px; color: var(--amber);
    transition: transform 180ms var(--ease); }
  #statusline .queue:hover:not(:disabled) { border-color: var(--bd2); transform: translateY(-1px); }
  #statusline .queue:disabled { color: var(--dim); cursor: default; }

  /* ---- Mermaid 灯箱 ---- */
  #lb { position: fixed; inset: 0; z-index: 99; display: none; background: rgba(15,19,25,.78); }
  #lb.open { display: block; }
  #lb-stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
  #lb-stage svg { position: absolute; top: 50%; left: 50%; transform-origin: 0 0; cursor: grab; max-width: none;
    background: var(--pan); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  #lb-stage.dragging svg { cursor: grabbing; }
  #lb-bar { position: absolute; top: 14px; right: 16px; display: flex; gap: 8px; z-index: 1; }
  #lb-bar button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35);
    width: 34px; height: 34px; border-radius: 10px; font-size: 16px; cursor: pointer; }
  #lb-bar button:hover { background: rgba(255,255,255,.25); }

  /* ---- 窄屏（阶段 D 验收 2：隐藏检查器 / 折叠目录 / 保留状态行）---- */
  @media (max-width: 1080px) {
    #app, #app:has(#inspector:not([hidden])) { grid-template-columns: 224px minmax(0, 1fr); }
    #inspector { display: none; }
  }
  @media (max-width: 760px) {
    #app, #app:has(#inspector:not([hidden])) { grid-template-columns: minmax(0, 1fr); }
    #sidebar { display: none; }
    #content { padding: 22px 18px 60px; }
    #meta { padding: 10px 18px; }
  }
  /* 动效全部只动 transform/opacity，且尊重系统的「减少动态效果」 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <!-- ① 快捷键栏：F1–F5 在静态 HTML 里恒在（D9 无 JS 外壳非空白），
         但默认全部 disabled —— JS 只启用「本页真有内容」的键，绝不出现点了没反应的死键（D8）。 -->
    <div id="fkeys" role="group" aria-label="快捷键">

  <!-- 底部状态行（§5.3 / §5.5）：静态读数先立着（D9 无 JS 不空白），JS 到位后填真值。
       「队列」是按钮不是文字——点得进去才不是装饰性遥测（§5.5 硬项）。 -->
  <div id="statusline" role="status">
    <span id="status-capture" class="cap-unknown">CAPTURE unknown</span>
    <span id="status-rate">决策捕获率 unknown</span>
    <span id="status-gap">断流 unknown</span>
    <span id="status-pages">unknown 页</span>
    <button id="status-queue" class="queue" disabled title="同步面板：本页数据未就绪">队列 unknown</button>
    <span id="status-stamp">--:--</span>

<div id="lb">
  <div id="lb-bar">
    <button id="lb-in" title="放大">＋</button>
    <button id="lb-out" title="缩小">−</button>
    <button id="lb-reset" title="复位">⟲</button>
    <button id="lb-close" title="关闭 (ESC)">✕</button>
  </div>

<script type="module">
import {
  stripFrontmatter, renderMarkdown, buildPageIndex, preprocessWikilinks,
  buildNavModel, buildMeta, chooseInitialLanguage, resolveLocalizedPage,
  baseFromPathname, buildConsoleModel, pollDecide, buildDocsRows, buildCrossRepoIndex,
  buildThemeRows, budgetNotice, buildStatusLine,
  renderAnchors, renderNoteHtml, renderDecisionTable,
} from './shell.mjs';

// per-repo serve 下 BASE="/"（行为同旧 ../wiki）；portal 下 BASE="/<repo>/"。
const BASE = baseFromPathname(location.pathname);

const mapMermaidTheme = t => (t === 'dark' ? 'dark' : 'default');
const themedSrc = (src, t) => `%%{init: {'theme':'${mapMermaidTheme(t)}'}}%%\n` + src;   // per-diagram 主题指令：每次渲染重新定主题，绕过 mermaid 全局 init 的主题缓存

let mermaidLoad = null;   // Promise once mermaid.min.js has been injected + initialized
function ensureMermaid() {
  if (!mermaidLoad) {
    mermaidLoad = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = './mermaid.min.js';
      s.onload = () => {
        try {
          window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: mapMermaidTheme(document.documentElement.getAttribute('data-theme')) });
          resolve();
        } catch (e) { mermaidLoad = null; reject(e); }
      };
      s.onerror = (e) => { mermaidLoad = null; reject(e); };
      document.head.appendChild(s);
    });
  }
  return mermaidLoad;
}

let MANIFEST = { axes: [] }, PAGE_INDEX = {}, FLAT = {}, SELECTED_LANG = 'en';
// 首屏数据读取失败的原因（null = 正常）。非空 → route() 在正文区给出**可见**的失败提示，
// 而不是把「取不到目录」伪装成「无此页」的 404（那会让读者以为是自己点错了页）。
let BOOT_ERROR = null;

// 首屏 manifest 读取。为什么单独抽出来：它是**唯一没有容错的第一跳数据源**——
// pollTick / fetchSyncStatus / createVisitSensor 都各有 try/catch，唯独它裸奔：fetch 瞬时失败或
// JSON 损坏 → 未处理拒绝 → boot() 断在第一条 await 上，侧栏 / 路由 / F 键全不启动，
// 壳停在死骨架（F1–F5 全 disabled）直到手动刷新。口径必须与同文件其它数据源一致。
// 顺带把「合法 JSON 但结构不对」也算失败：下游 firstPageKey / buildNavModel 都会裸访 MANIFEST.axes。
async function loadManifest() {
  const res = await fetch(BASE + 'wiki/.manifest.json', { cache: 'no-store' });   // 同 pollTick：绕开 python serve 的启发式缓存
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const m = await res.json();
  if (!Array.isArray(m?.axes)) throw new Error('manifest 缺少 axes');
  return m;
}

async function boot() {
  try {
    MANIFEST = await loadManifest();
  } catch (err) {
    // 退到安全默认（空目录）+ 记下原因：其余接线照常执行，route() 把原因显示在正文区。
    // 不在这里重试：重试要重跑下面那串 wire*，会重复绑定事件（同一个监听器叠两份）。
    // 15s 轮询是既有的自愈路径——manifest 恢复后它会弹「内容已更新」提示条让读者一点回正文。
    MANIFEST = { axes: [] };
    BOOT_ERROR = err?.message || String(err);
  }
  PAGE_INDEX = buildPageIndex(MANIFEST);
  FLAT = {};
  for (const ax of MANIFEST.axes) for (const p of ax.pages) FLAT[`${ax.id}/${p.id}`] = p;
  SELECTED_LANG = chooseInitialLanguage(MANIFEST, localStorage.getItem('lore-language'));
  buildSidebar();
  wireSearch();
  wireTheme();
  wireShortcuts();   // 快捷键栏 F1–F5：只启用「本页真有内容」的键（D8）
  wireInspector();   // 引出线注记：正文角标 ↔ 右栏注记的高亮交互（事件委托，正文重建不丢绑）
  wireLanguage();
  await fetchSyncStatus();
  wireSyncConsole();
  renderSyncLight();
  wireRepoSwitch();   // portal 形态才生效（fire-and-forget，不阻塞 route）
  LAST_GENERATED = MANIFEST.generated ?? null;
  schedulePoll(15000);
  window.addEventListener('hashchange', route);
  route();
}

function wireLanguage() {
  const sel = document.getElementById('language');
  const cfg = MANIFEST.language ?? { default: 'en', available: ['en'] };
  sel.innerHTML = cfg.available.map(lang => `<option value="${lang}">${lang}</option>`).join('');
  sel.value = SELECTED_LANG;
  sel.style.display = cfg.available.length > 1 ? '' : 'none';
  sel.addEventListener('change', async () => {
    SELECTED_LANG = sel.value;
    localStorage.setItem('lore-language', SELECTED_LANG);
    try {
      await fetch(BASE + 'api/preferences', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ language: SELECTED_LANG }),
      });
    } catch { /* static (python) server has no API; localStorage still persists */ }
    route();
  });
}

function buildSidebar() {
  const nav = document.getElementById('sidebar');
  const linkHtml = (ax, p) => `<a href="#${ax.id}/${p.id}" data-key="${ax.id}/${p.id}"
     data-search="${(p.title + ' ' + (p.summary||'')).toLowerCase()}">
    ${p.title}${p.stale ? `<span class="stale">⚠${p.stale}</span>` : ''}</a>`;
  const DOCS_ICON = { '项目状态': '📌', '设计与计划': '📐', 'notes': '📝' };
  const docsGroupsState = () => {
    try { return JSON.parse(localStorage.getItem('lore-docs-groups') || '{}'); } catch { return {}; }
  };
  const docsHtml = (ax) => {
    const opened = docsGroupsState();
    return buildDocsRows(ax.pages).map(g => {
      const open = g.group in opened ? !!opened[g.group] : !g.collapsed;
      const rows = g.rows.map(r => `<a href="#${ax.id}/${r.page.id}" data-key="${ax.id}/${r.page.id}"
         data-search="${(r.page.title + ' ' + (r.page.summary || '') + ' ' + r.page.id + (r.planPage ? ' ' + r.planPage.id : '')).toLowerCase()}">
        ${r.displayTitle}${r.planPage ? `<span class="plan-badge" data-plan="${ax.id}/${r.planPage.id}" title="查看实施计划">plan</span>` : ''}${r.page.last_updated ? `<span class="when">📅 ${r.page.last_updated}</span>` : ''}</a>`).join('');
      return `<div class="dgrp${open ? '' : ' closed'}" data-group="${g.group}">
        <div class="grp grp-toggle"><span class="caret">${open ? '▾' : '▸'}</span>${DOCS_ICON[g.group] ?? ''} ${g.group} (${g.rows.length})</div>
        <div class="grp-rows">${rows}</div>
      </div>`;
    }).join('');
  };
  const themeHtml = (ax) => buildThemeRows(ax.pages).map(row => {
    const kids = row.groups.map(g =>
      (g.group ? `<div class="grp">▸ ${g.group}</div>` : '') + g.rows.map(k => linkHtml(ax, k)).join('')
    ).join('');
    return linkHtml(ax, row.page) + (kids ? `<div class="theme-children">${kids}</div>` : '');
  }).join('');
  const pagesHtml = (ax) => {
    if (ax.id === 'docs') return docsHtml(ax);
    if (ax.id === 'theme') return themeHtml(ax);
    if (ax.id !== 'component') return ax.pages.map(p => linkHtml(ax, p)).join('');
    let out = '', lastGroup = null;                          // component 轴：按连续 group 插小标题
    for (const p of ax.pages) {
      const g = p.group || '';
      if (g && g !== lastGroup) out += `<div class="grp">▸ ${g}</div>`;
      lastGroup = g;
      out += linkHtml(ax, p);
    }
    return out;
  };
  nav.innerHTML = buildNavModel(MANIFEST).map(ax => `
    <div class="axis" data-axis="${ax.id}">
      <div class="axis-h"><span class="dot ${ax.id}"></span>${ax.label}<span class="caret">▼</span></div>
      <div class="links">${pagesHtml(ax)}</div>
    </div>`).join('');
  nav.querySelectorAll('.axis-h').forEach(h =>
    h.onclick = () => h.parentElement.classList.toggle('collapsed'));
  nav.querySelectorAll('.grp-toggle').forEach(h => h.onclick = () => {
    const box = h.parentElement;
    const nowOpen = box.classList.toggle('closed') === false;
    h.querySelector('.caret').textContent = nowOpen ? '▾' : '▸';
    const st = docsGroupsState();
    st[box.dataset.group] = nowOpen;
    localStorage.setItem('lore-docs-groups', JSON.stringify(st));
  });
  nav.querySelectorAll('.plan-badge').forEach(b => b.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();               // 别触发外层 <a> 的 spec 跳转
    location.hash = b.dataset.plan;
  });
}

function renderMeta(page) {
  const cls = { plain: 'chip', stale: 'chip stale', fresh: 'chip fresh' };
  const chips = buildMeta(page).chips.map(c => c.action === 'queue'
    ? `<button class="${cls[c.kind]}" data-queue-page="${c.path}">${c.icon} ${c.text}</button>`
    : `<span class="${cls[c.kind]}">${c.icon} ${c.text}</span>`).join('');
  // 「✏️ 重写这页」=带指令的质量改进（不限 stale，fresh 也能点）——和机械「排队同步」分开概念。docs 物化页不重写 prose。
  const rewrite = page.axis === 'docs' ? ''
    : `<button class="chip" data-rewrite-page="${page.path}" title="按你的要求改进这页（可填具体指令）">✏️ 重写这页</button>`;
  return chips + rewrite;
}

function renderTranslateState(page, localized) {
  if (!localized.missing && !localized.stale) return '';
  const text = localized.stale ? `translation stale: ${localized.lang}` : `translation missing: ${localized.lang}`;
  return `<button id="translate-page" class="chip stale" data-page="${page.path}" data-lang="${localized.lang}">🌐 ${text}</button>`;
}

// 往 innerHTML 里塞外部/运行时字符串（错误信息、hash）前的最小转义。**保持单行**：
// test/shell.test.js 按整行抽它（花括号配对抽取器会被这里面的正则与对象字面量带偏）。
const escapeHtml = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// 单调递增的导航序号：每次 route() 领一个，每个 await 之后比对——过期的那次渲染直接丢弃。
// 为什么必须有：连续两次 hash 切换会并发跑两个 route()，慢的那个后落地会把新页整体覆盖回旧页
// （经典 SPA 竞态：先点 A 后点 B，屏幕上却是 A）。序号在**函数第一行**就领，
// 这样连「切到 #console」这种同步分支也能让在途的页渲染作废。
let ROUTE_SEQ = 0;

// 404 面板：**已知但取不到**的页走这里（hash 不在 manifest 里 / 页文件非 2xx）。
// 两处入口共用一份文案，免得两处漂移。清空注记栏是硬要求：404 页没有锚点，
// 残留上一页的注记会把读者引到不存在的行号上。
function renderNotFound(hash) {
  document.getElementById('meta').innerHTML = '';
  document.getElementById('content').innerHTML = `<h1>404</h1><p>无此页：<code>${escapeHtml(hash)}</code></p>`;
  renderInspector([]);
}

// manifest 没读到时的正文区提示（可见的错误，既不是死骨架、也不是误导性的 404）：
// 外壳其余部分照常可用（搜索 / 主题 / sync 面板 / 状态行），15s 轮询若自愈会弹提示条让读者回来。
function renderBootFailure() {
  document.getElementById('meta').innerHTML = '';
  document.getElementById('content').innerHTML =
    '<h1>⚠ 页面目录加载失败</h1>'
    + `<p>读取 <code>wiki/.manifest.json</code> 失败：<code>${escapeHtml(BOOT_ERROR)}</code></p>`
    + '<p>侧栏目录与正文暂时为空；数据恢复后刷新本页即可。搜索 / 主题 / sync 面板仍可用。</p>';
  renderInspector([]);
}

// 正文「核身」失败（网络断 / fetch 抛错）：必须显示**加载失败**，不许静默停在上页——
// 停在上页会让读者以为当前 hash 就是屏幕上那份内容，比空白更坏的谎。
function renderLoadError(hash, err) {
  document.getElementById('meta').innerHTML = '';
  document.getElementById('content').innerHTML =
    '<h1>⚠ 页面加载失败</h1>'
    + `<p><code>${escapeHtml(hash)}</code> 的正文没能取到：<code>${escapeHtml(err?.message || err)}</code></p>`
    + '<p>网络恢复后点 F1 或左侧目录重进本页即可。</p>';
  renderInspector([]);
}

async function route() {
  const seq = ++ROUTE_SEQ;      // 领号：本函数每个 await 之后都要比对，过期就丢弃这一次渲染
  const hash = location.hash.slice(1) || firstPageKey();
  const page = FLAT[hash];
  if (hash === 'console') {
    document.querySelectorAll('#sidebar a').forEach(a => a.classList.remove('active'));
    renderInspector([]);        // 切到控制台也要清空注记：残留上一页的注记比空栏更坏
    renderConsolePage();
    document.getElementById('main').scrollTop = 0;   // 仅导航时回顶；操作读回的重渲染保留滚动位
    return;
  }
  document.querySelectorAll('#sidebar a').forEach(a =>
    a.classList.toggle('active', a.dataset.key === hash));
  if (!page) {
    if (BOOT_ERROR) renderBootFailure(); else renderNotFound(hash);
    return;
  }
  const localized = resolveLocalizedPage(page, SELECTED_LANG);
  let raw;
  try {
    const res = await fetch(BASE + 'wiki/' + localized.path, { cache: 'no-store' });   // python serve 的启发式缓存会吃掉刚 finalize 的新内容
    if (seq !== ROUTE_SEQ) return;                     // 过期：新的一次导航已经落地，丢弃这一次（并发防护）
    // 页文件缺失时 serveStatic 回 404 + 正文 'not found'——不查 res.ok 就会把这行字符串
    // 当 markdown 渲染成正文（读者看到「not found」四个字当页面），必须走既有 404 分支。
    if (!res.ok) { renderNotFound(hash); return; }
    raw = await res.text();
    if (seq !== ROUTE_SEQ) return;                     // 正文 await 之后再比一次：慢的那份不许落地
  } catch (err) {
    if (seq !== ROUTE_SEQ) return;
    renderLoadError(hash, err); return;
  }
  // 阶段 C 的渲染管线（验收 ①）——顺序是硬约束，两步分别落在不同层次：
  //   ① renderDecisionTable：**md 层次**的改造（决策史哨兵区的列表 → 三列表格 md，
  //      内部就是 parseDecisionLog 的三列结果 + 空态判定：无决策史小节 / 无列表 → 原样返回，
  //      所以无决策史的页不会长出空表头），必须发生在 renderMarkdown **之前**（表格渲染器吃 md）。
  //   ② renderAnchors：**HTML 层次**的插标（给锚点插上标角标，并给出右栏注记模型；两形态见 D15——
  //      行级 `fn @ file:line` 与文件级 `fn @ file` 都收，但区别渲染），
  //      必须发生在 renderMarkdown **之后**（它按标签切段、要跳过 <pre>/mermaid，md 源里没有标签）。
  const { html, notes } = renderAnchors(
    preprocessWikilinks(renderMarkdown(renderDecisionTable(stripFrontmatter(raw))), PAGE_INDEX));
  document.getElementById('meta').innerHTML = renderMeta(page) + renderTranslateState(page, localized);
  document.getElementById('content').innerHTML = html;
  renderInspector(notes);       // 每次切页**重建**注记栏（验收 ⑤：不残留上一页注记）
  tagDecisionTable();           // 决策史表的排版钩子（版本/日期用 mono）；没有该表就什么都不做
  const mNodes = document.querySelectorAll('#content .mermaid');
  if (mNodes.length) {
    const tNow = document.documentElement.getAttribute('data-theme');
    mNodes.forEach(div => { if (div.dataset.src == null) div.dataset.src = div.textContent; div.textContent = themedSrc(div.dataset.src, tNow); });   // 存纯源码 + 注入当前主题指令再渲染
    try { await ensureMermaid(); await window.mermaid.run({ nodes: mNodes }); }
    catch { /* missing asset or bad diagram: leave source text visible, page stays usable */ }
    mNodes.forEach(div => { if (div.querySelector('svg')) div.onclick = () => LB.open(div); });
  }
  // mermaid 的 await 同样是一次让出点：这一段时间里读者可能已经切到别页，下面的接线读的是
  // **当前 DOM**（`#meta button[data-rewrite-page]` 等），过期的这次不许再碰新页的元素。
  if (seq !== ROUTE_SEQ) return;
  const translateBtn = document.getElementById('translate-page');
  if (translateBtn) {
    translateBtn.onclick = async () => {
      translateBtn.disabled = true;
      translateBtn.textContent = '🌐 translation requested';
      try {
        await fetch(BASE + 'api/translation-requests', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ page: translateBtn.dataset.page, target_lang: translateBtn.dataset.lang }),
        });
      } catch {
        translateBtn.textContent = `run: node lib/translate.js plan .lore ${translateBtn.dataset.page} ${translateBtn.dataset.lang}`;
      }
    };
  }
  // 机械徽标点击=排队/同步（追代码 / 补缺结构，无指令）。徽标住 #meta（不是 #content）
  document.querySelectorAll('#meta button[data-queue-page]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = '排队中…';
    try {
      const res = await fetch(BASE + 'api/sync/rewrite-requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ page: b.dataset.queuePage }) });
      if (!res.ok) throw new Error(String(res.status));
      b.textContent = '已排队 ✍（auto 档后台消化；或会话跑 /lore:sync）';
    } catch { b.textContent = '⚠ 排队不可用（静态服务）——/lore:serve 重启后可用'; }
  });
  // 「✏️ 重写这页」=带指令的质量改进：弹框填要求 → 进队列带 instruction → runner/sync 按你的意图重写
  document.querySelectorAll('#meta button[data-rewrite-page]').forEach(b => b.onclick = async () => {
    const instruction = prompt('重写要求（留空 = 通用重写/追代码；填写 = 按你的要求改进这页，例：精简概览段、加个调用例子、换个叙述角度）');
    if (instruction === null) return;   // 取消
    b.disabled = true; b.textContent = '排队中…';
    try {
      const res = await fetch(BASE + 'api/sync/rewrite-requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ page: b.dataset.rewritePage, instruction }) });
      if (!res.ok) throw new Error(String(res.status));
      b.textContent = instruction.trim() ? '已排队 ✏️（带指令 · auto 档后台消化 / 或 /lore:sync）' : '已排队 ✍（通用重写）';
    } catch { b.textContent = '⚠ 排队不可用（静态服务）'; }
  });
  document.getElementById('main').scrollTop = 0;
}

// --- 阶段 C 视觉①：引出线注记栏（#inspector，设计 §5.4 / D4 / D8）---
// 为什么每次 route() 都**重建**而不是增量更新：注记是本页正文的派生数据（编号 = 正文出现顺序），
// 切页残留上一页的注记会把读者引到不存在的行号上——比空栏更坏。故「无注记」与「清空」走同一条路径：
// 先清空，再决定显示与否。
// 空白态是硬要求（验收 ⑥）：notes 为空 → 保持 hidden，绝不出现空注记栏，也不占第三列宽度
// （#app 的 :has(#inspector:not([hidden])) 只在真有内容时才让出 268px）。F4 的 enabled() 看的也是这个 hidden。
const FLASH_MS = 1400;        // 验收 ③：约 1.4 秒后移除高亮
let flashTimer = null;

// F4「开关检查器」（D8）的判据：**本页有没有注记**，而不是「检查器当前是否可见」。
// 若判据取 visibility，收起检查器就会把 F4 自己关掉——「收起」成了不可逆的死状态（D8 禁死键）。
let INSPECTOR_NOTES = [];
let INSPECTOR_OPEN = false;
let currentNoteN = null;      // `[` / `]` 的游标：当前定位到第几号注记（切页重置）

function cancelFlash() {
  clearTimeout(flashTimer); flashTimer = null;
  document.querySelectorAll('#inspector .note.flash').forEach(el => el.classList.remove('flash'));
}

function renderInspector(notes) {
  const box = document.getElementById('inspector');
  box.innerHTML = '';                              // 重建：先清空（切页不残留）
  cancelFlash();                                   // 重建即撤销上一页遗留的高亮计时器
  INSPECTOR_NOTES = notes;                         // F4 / `[` `]` 的判据（与可见性解耦，见上）
  currentNoteN = null;                             // 切页游标归零，不带到下一页的编号上
  if (!notes.length) { box.hidden = true; INSPECTOR_OPEN = false; return; }
  // D7 + D15：行级锚点逐字原样显示（生成时刻的 file:line，不重解析、不改写行号）；
  // 文件级锚点（源未给行号）**不显示行号**并由 renderNoteHtml 显式标注——区别渲染是硬要求，
  // 故单条的 HTML 由 shell.mjs 的纯函数产出（可在 Node 里断言），这里只做拼装。
  box.innerHTML = `<div class="insp-title">引出线注记 · ${notes.length}</div>`
    + notes.map(renderNoteHtml).join('');
  box.hidden = false;
  INSPECTOR_OPEN = true;                           // 每页默认展开（收起是读者在**本页**的手动状态，不跨页继承）
}

// F4 的开关（D8：「F4 = 聚焦/**开关**检查器」）。收起只是把这一列藏掉——注记模型仍在
// INSPECTOR_NOTES 里，所以还能再展开；展开时滚进视口（原来是 hidden 的，不滚就等于没开）。
function openInspector() {
  if (!INSPECTOR_NOTES.length) return;             // 无注记 → 不展开空栏（验收 ⑥）
  document.getElementById('inspector').hidden = false;
  INSPECTOR_OPEN = true;
}

function closeInspector() {
  document.getElementById('inspector').hidden = true;
  INSPECTOR_OPEN = false;
}

function toggleInspector() {
  if (INSPECTOR_OPEN) closeInspector();
  else { openInspector(); document.getElementById('inspector').scrollIntoView({ block: 'nearest' }); }
  refreshShortcuts();                              // 按钮标题要说实话（展开/收起），否则 UI 在骗人
}

// D8 后半：`[` / `]` 在注记间跳转（上一条 / 下一条）。
// 到端点**环绕**：末条再按 `]` 回第一条——否则「按了没反应」正是 D8 要禁的死键形态。
// 目标注记不在视口内才滚动（block:'nearest' 的语义），并高亮之（与点角标同一条高亮路径）。
function navNote(dir) {
  if (!INSPECTOR_NOTES.length) return;
  const ns = INSPECTOR_NOTES.map(n => n.n);
  const i = ns.indexOf(currentNoteN);
  const next = i < 0
    ? (dir > 0 ? ns[0] : ns[ns.length - 1])        // 还没定位过：向前从第一条、向后从最后一条起
    : ns[(i + dir + ns.length) % ns.length];
  currentNoteN = next;
  openInspector();                                 // 收起时先展开：否则「高亮了一条看不见的注记」
  refreshShortcuts();
  flashNote(next);
  document.getElementById(`note-${next}`)?.scrollIntoView({ block: 'nearest' });
}

// 输入控件里的方括号是**正文**，不是快捷键（搜索框里打 `[` 不该跳注记）。F1–F5 不受此限：
// 功能键在输入框里也打不出字符，屏蔽它们只会让快捷键在搜索时失效。
const isTyping = t => !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA'
  || t.tagName === 'SELECT' || t.isContentEditable);

// 点正文角标 → 对应注记高亮约 1.4s；点别处取消（验收 ③）。
// 用 document 上的**事件委托**（而非逐角标绑）：正文每次 route() 整块重建，
// 逐角标 addEventListener 会在重建后丢绑——那正是「点了没反应」的死键形态（D8 禁止）。
function flashNote(n) {
  cancelFlash();
  const el = document.getElementById(`note-${n}`);
  if (!el) return;                                 // 注记栏被清空（切页竞态）时静默无操作，不报错
  el.classList.add('flash');
  flashTimer = setTimeout(() => { el.classList.remove('flash'); flashTimer = null; }, FLASH_MS);
}

function wireInspector() {
  document.addEventListener('click', e => {
    const badge = e.target.closest?.('.anchor-ref');
    if (badge) flashNote(badge.dataset.anchorN); else cancelFlash();   // 点角标=高亮；点任何别处=取消
  });
  // 角标是 role="button" tabindex="0"（renderAnchors 产出）：键盘也要能触发，否则它是死控件。
  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const badge = e.target.closest?.('.anchor-ref');
    if (!badge) return;
    e.preventDefault();                            // 空格默认滚页；这里它是「按下按钮」
    flashNote(badge.dataset.anchorN);
  });
  // D8 后半：`[` `]` 注记间跳转。只在注记存在时生效（INSPECTOR_NOTES 判据，同 F4）。
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key !== '[' && e.key !== ']') return;
    if (isTyping(e.target)) return;
    if (!INSPECTOR_NOTES.length) return;           // 无注记 → 不注册（不抢浏览器默认行为）
    e.preventDefault();
    navNote(e.key === ']' ? 1 : -1);
  });
}

// 决策史表的排版钩子：md 表格渲染器不产 class，而版本/日期两列要按 §5.2 的字体分工用 mono。
// 用「决策史小节里的第一张表」精确定位（不用文字启发式），别的表格不连坐；没有表则什么都不做。
function tagDecisionTable() {
  const h = decisionSection();
  if (!h) return;
  for (let el = h.nextElementSibling; el && el.tagName !== 'H2'; el = el.nextElementSibling) {
    if (el.tagName === 'TABLE') { el.classList.add('journal-table'); return; }
  }
}

const RO_ATTR = 'disabled title="只读模式（portal 或 python server）——本地 /lore:serve --node 可操作"';

function renderConsolePage() {
  const m = buildConsoleModel(MANIFEST, SYNC_STATUS);
  const modeDesc = { manual: '一切手动——commit 不触发任何后台动作', notify: 'commit 后自动机械刷新（决策史/manifest/stale），prose 重写排队提醒', auto: 'commit 静默期后自动重写 stale 页（后台只读 LLM，质量门把关）' };
  const rows = m.stalePages.map(p => `
    <tr><td><a href="#${p.key}">${p.key}</a></td>
      <td><span class="tag w">⚠ ${p.stale} commits</span></td>
      <td>${p.last_updated || '—'}</td>
      <td>${QUEUED_PAGES.has(p.path)
        ? '<span class="tag q">已排队 ✓</span>'
        : `<button data-queue="${p.path}" ${SYNC_API_OK ? '' : RO_ATTR}>✍ 排队</button>`}</td></tr>`).join('');
  document.getElementById('meta').innerHTML = '';
  document.getElementById('content').innerHTML = `
    <h1>⚙ 同步控制台</h1>
    <div class="console-sec">
      <h3>档位</h3>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span class="seg" id="console-seg">
          <button data-mode="manual" ${SYNC_API_OK ? '' : RO_ATTR}>手动</button>
          <button data-mode="notify" ${SYNC_API_OK ? '' : RO_ATTR}>提醒</button>
          <button data-mode="auto" ${SYNC_API_OK ? '' : RO_ATTR}>全自动</button>
        </span>
        <span style="color:var(--fg-dim);font-size:12.5px">${modeDesc[m.mode] ?? ''}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12.5px">
        <span style="color:var(--fg-dim)">auto 参数：</span>
        <label>静默 <input id="cfg-debounce" type="number" min="0" max="1440" value="${SYNC_STATUS?.config?.debounce_minutes ?? 10}"
          style="width:54px;background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:5px;padding:2px 6px" ${SYNC_API_OK ? '' : 'disabled'}> 分钟</label>
        <label>每日 <input id="cfg-schedule" type="text" placeholder="HH:MM 或留空" value="${SYNC_STATUS?.config?.schedule ?? ''}"
          style="width:90px;background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:5px;padding:2px 6px" ${SYNC_API_OK ? '' : 'disabled'}></label>
        <label>单次 ≤ <input id="cfg-maxpages" type="number" min="1" max="50" value="${SYNC_STATUS?.config?.max_pages ?? 5}"
          style="width:46px;background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:5px;padding:2px 6px" ${SYNC_API_OK ? '' : 'disabled'}> 页</label>
        <label>后端 <select id="cfg-backend"
          style="background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:5px;padding:2px 6px" ${SYNC_API_OK ? '' : 'disabled'}>
          <option value="auto"${(SYNC_STATUS?.config?.backend ?? 'auto') === 'auto' ? ' selected' : ''}>auto（探测）</option>
          <option value="claude"${SYNC_STATUS?.config?.backend === 'claude' ? ' selected' : ''}>claude</option>
          <option value="codex"${SYNC_STATUS?.config?.backend === 'codex' ? ' selected' : ''}>codex</option>
          <option value="opencode"${SYNC_STATUS?.config?.backend === 'opencode' ? ' selected' : ''}>opencode</option>
        </select></label>
        <button id="cfg-save" ${SYNC_API_OK ? '' : RO_ATTR}>保存</button>
        <span id="cfg-msg" style="color:var(--fg-dim)"></span>
      </div>
    </div>
    <div class="console-sec">
      <h3>待重写队列（manifest stale &gt; 0）</h3>
      ${m.staleTotal ? `<table><tr><th>页面</th><th>落后</th><th>正文最后重写</th><th></th></tr>${rows}</table>` : '<p style="color:var(--fg-dim)">全部新鲜 ✓</p>'}
      <div style="margin-top:10px">
        ${(() => {
          const unq = m.stalePages.filter(p => p.path && !QUEUED_PAGES.has(p.path)).length;
          if (!SYNC_API_OK) return `<button id="console-queue-all" ${RO_ATTR}>✍ 全部排队</button>`;
          if (!m.staleTotal) return '<button id="console-queue-all" disabled>✍ 全部排队</button>';
          if (!unq) return `<button id="console-queue-all" disabled>✓ 已排队 ${m.staleTotal} 页</button>`;
          return `<button id="console-queue-all">✍ 全部排队 (${unq})</button>`;
        })()}
        <button id="console-finalize" ${SYNC_API_OK ? '' : RO_ATTR}>⟳ 立即机械刷新</button>
      </div>
    </div>
    <div class="console-sec">
      <h3>状态</h3>
      <table>
        <tr><td style="color:var(--fg-dim)">上次机械刷新</td><td>${m.lastFinalize ? new Date(m.lastFinalize).toLocaleString() : '—'}</td></tr>
        <tr><td style="color:var(--fg-dim)">已排队请求</td><td>${queuedCountText()}${QUEUED_OK ? ` —— ${m.mode === 'auto' ? '后台 runner 自动消化' : '下次会话 /lore:sync 优先消化'}` : ''}</td></tr>
      </table>
    </div>
    <div class="console-sec">
      <h3>自动重写任务历史</h3>
      ${SYNC_RUNS.length ? `<table><tr><th>时间</th><th>页数</th><th>结果</th><th>详情</th></tr>${
        SYNC_RUNS.map(r => {
          const ok = r.pages.filter(p => p.ok).length;
          const fails = r.pages.filter(p => !p.ok);
          const ub = (r.pages ?? []).find(p => p.backend)?.backend;   // 成功行也显示实际后端（spec D6：控制台可见）
          return `<tr><td>${new Date(r.ts).toLocaleString()}</td><td>${r.pages.length}</td>
            <td>${ok ? `<span class="tag q">✓ ${ok}</span>` : ''}${fails.length ? ` <span class="tag w">✗ ${fails.length}</span>` : ''}</td>
            <td style="color:var(--fg-dim);font-size:12px">${fails.slice(0, 2).map(f => `${f.page.split('/').pop()}${f.backend ? ' · ' + f.backend : ''}: ${f.reason}`).join('；') || `${Math.round(r.total_ms / 1000)}s${ub ? ' · ' + ub : ''}`}</td></tr>`;
        }).join('')}</table>` : '<p style="color:var(--fg-dim)">暂无运行记录（auto 档触发后在此显示）</p>'}
    </div>`;
  document.querySelectorAll('#console-seg button').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === m.mode);
    b.onclick = async () => {
      try {
        await fetch(BASE + 'api/sync/mode', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mode: b.dataset.mode }) });
      } catch {}
      await fetchSyncStatus(); renderSyncLight(); renderConsolePage();   // 失败也读回真值（统一失败语义）
    };
  });
  document.querySelectorAll('#content button[data-queue]').forEach(b => b.onclick = async () => {
    b.disabled = true; b.textContent = '排队中…';                // 即时反馈；重渲染后变「已排队 ✓」tag
    try {
      await fetch(BASE + 'api/sync/rewrite-requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ page: b.dataset.queue }) });
    } catch {}
    await fetchSyncStatus(); renderSyncLight(); renderConsolePage();
  });
  const qa = document.getElementById('console-queue-all');
  if (qa) qa.onclick = async () => {
    qa.disabled = true; qa.textContent = '排队中…';
    for (const p of m.stalePages) if (p.path && !QUEUED_PAGES.has(p.path)) {
      try { await fetch(BASE + 'api/sync/rewrite-requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ page: p.path }) }); } catch {}
    }
    await fetchSyncStatus(); renderSyncLight(); renderConsolePage();
  };
  const fz = document.getElementById('console-finalize');
  if (fz) fz.onclick = async () => {
    try { await fetch(BASE + 'api/sync/finalize', { method: 'POST' }); startFastPoll(); }
    catch { await fetchSyncStatus(); renderSyncLight(); renderConsolePage(); }   // server 挂了 → 降级态亮出（与面板同语义）
  };
  const cs = document.getElementById('cfg-save');
  if (cs) cs.onclick = async () => {
    const msg = document.getElementById('cfg-msg');
    cs.disabled = true; msg.textContent = '保存中…';
    try {
      const r = await fetch(BASE + 'api/sync/config', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          debounce_minutes: Number(document.getElementById('cfg-debounce').value),
          schedule: document.getElementById('cfg-schedule').value.trim() || null,
          max_pages: Number(document.getElementById('cfg-maxpages').value),
          backend: document.getElementById('cfg-backend').value,
        }) });
      msg.textContent = r.ok ? '✓ 已保存' : '✗ 参数不合法（静默 0-1440 / HH:MM / 1-50 页 / 后端 auto|claude|codex|opencode）';
    } catch { msg.textContent = '✗ 保存失败'; }
    cs.disabled = false;
    await fetchSyncStatus(); renderSyncLight();            // 读回真值（面板摘要同步刷新）
  };
}

function firstPageKey() {
  for (const ax of MANIFEST.axes) if (ax.pages[0]) return `${ax.id}/${ax.pages[0].id}`;
  return '';
}

// 仓库切换（两种形态统一）：portal 下相对跳 /<name>/site/；per-repo 下响应带 portal 端口
// → 跳 portal 绝对 URL（portal 没起则跳转失败，自然提示用户 /lore:portal start）。
// 旧 server / python 静态下 /repos.json 404 → catch 静默跳过，零影响。
let REPOS_INFO = null;        // {repos, portalRoot, cur} —— 切换器与跨 repo 搜索共用
async function wireRepoSwitch() {
  try {
    const info = await (await fetch('/repos.json')).json();
    const repos = info.repos;
    if (!Array.isArray(repos) || repos.length === 0) return;
    const onPortal = BASE !== '/';
    const cur = onPortal ? BASE.replaceAll('/', '') : (info.current ?? '');
    const portalRoot = onPortal ? '/' : `http://127.0.0.1:${info.portal}/`;
    REPOS_INFO = { repos, portalRoot, cur };
    const home = document.createElement('a');
    home.id = 'portal-home'; home.href = portalRoot; home.textContent = '🏠'; home.title = '仓库列表（portal）';
    const sel = document.createElement('select');
    sel.id = 'repo-switch'; sel.title = '切换仓库';
    sel.innerHTML = repos.map(r => `<option value="${r}"${r === cur ? ' selected' : ''}>${r}</option>`).join('');
    sel.onchange = () => { location.href = portalRoot + encodeURIComponent(sel.value) + '/site/'; };
    const brand = document.getElementById('brand');
    brand.after(sel);
    brand.after(home);
  } catch { /* repos.json 不可达（旧 server / python）→ 无切换 UI */ }
}

// 跨 repo 搜索（portal 余项兑现）：搜索词非空时懒加载其他 repo 的 manifest，
// 命中列在侧栏底部「其他仓库」区，点击跳对应 repo（portal 相对 / per-repo 经 portal 绝对）。
// 缓存语义（两种 null 与两种空）：
//   CROSS_INDEX === null  → 还没加载 **或** 上次全军覆没（可重试）；CROSS_INDEX === [] → 已加载、就是没有别的仓/没有命中。
//   CROSS_INFLIGHT 管重入，不参与「加载过没有」的判定——混用就是上一轮那个「一次失败永不再试」的根因。
let CROSS_INDEX = null;       // 懒加载缓存；null=未加载（**也等于「上次全军覆没，可重试」**）
let CROSS_INFLIGHT = false;   // 在途标志：重入防护与「结果缓存」是两件事，必须分开记（见下）
async function ensureCrossIndex() {
  if (CROSS_INFLIGHT || CROSS_INDEX !== null || !REPOS_INFO) return;
  CROSS_INFLIGHT = true;
  try {
    const others = REPOS_INFO.repos.filter(r => r !== REPOS_INFO.cur);
    const entries = await Promise.all(others.map(async repo => {
      try { return { repo, manifest: await (await fetch(`${REPOS_INFO.portalRoot}${encodeURIComponent(repo)}/wiki/.manifest.json`, { cache: 'no-store' })).json() }; }
      catch { return null; }
    }));
    const ok = entries.filter(Boolean);
    // 为什么不能再用 `CROSS_INDEX = []` 当在途占位：portal 瞬时不可用（其它仓 manifest 全失败）时，
    // 它会存下一个**看起来像结果**的空数组，而 `CROSS_INDEX !== null` 的守卫让跨仓搜索**永不再试**，
    // 直到整页刷新——一次瞬时故障 = 该功能静默死掉（且没有任何提示）。
    // 故：确有其它仓要拉、却一个都没成 → 复位 null（= 未加载）让下一次输入重试；
    // 真的没有其它仓 / 拉到过 → 保留空数组语义（没有更多可拉，不必再试）。
    CROSS_INDEX = (others.length > 0 && ok.length === 0) ? null : buildCrossRepoIndex(ok);
  } finally {
    CROSS_INFLIGHT = false;   // 成败都放行：否则一次抛错会把跨仓索引一起永久锁死
  }
}

function renderCrossHits(term) {
  let box = document.getElementById('cross-hits');
  if (!term || !CROSS_INDEX || !CROSS_INDEX.length || !REPOS_INFO) { if (box) box.remove(); return; }
  const hits = CROSS_INDEX.filter(x => x.search.includes(term)).slice(0, 12);
  if (!hits.length) { if (box) box.remove(); return; }
  if (!box) {
    box = document.createElement('div');
    box.id = 'cross-hits';
    document.getElementById('sidebar').appendChild(box);
  }
  box.innerHTML = `<div class="grp">🌐 其他仓库 (${hits.length})</div>` + hits.map(h =>
    `<a href="${REPOS_INFO.portalRoot}${encodeURIComponent(h.repo)}/site/#${h.key}"><span class="cross-repo">${h.repo}</span>${h.title}</a>`).join('');
}

function wireSearch() {
  document.getElementById('q').addEventListener('input', async e => {
    const term = e.target.value.toLowerCase().trim();
    document.getElementById('sidebar').classList.toggle('searching', !!term);   // 搜索穿透折叠组
    if (term && REPOS_INFO) { await ensureCrossIndex(); }
    renderCrossHits(term);

    document.querySelectorAll('#sidebar .links a').forEach(a =>
      a.classList.toggle('hidden', term && !a.dataset.search.includes(term)));
    document.querySelectorAll('.axis').forEach(ax => {
      const any = [...ax.querySelectorAll('a')].some(a => !a.classList.contains('hidden'));
      ax.style.display = any ? '' : 'none';
    });
  });
}

// --- 快捷键栏（设计 §5.3 顶部 / D5 / D8）---
// 纪律：**只注册有内容的键**——点了没反应的按钮就是死键（§5.5 明确禁止装饰性控件）。
// 静态 HTML 里五个键恒在且 disabled（D9：无 JS 时外壳非空白），本块按当前状态逐个启用。
//
// 可用性取决于「当前页渲染出了什么」（决策史小节 / #meta 的重写按钮），而正文是 route() 在客户端
// 注入的（SPA，§1.1 事实 4）——故用 MutationObserver 在正文落地后再刷新一次可用性，
// **不改 route() / renderMeta 的既有逻辑**。
const FKEY = {
  F1: {
    title: 'Wiki 首页',
    enabled: () => firstPageKey() !== '',
    run: () => { location.hash = firstPageKey(); },
  },
  F2: {
    title: '检索：聚焦搜索框',
    enabled: () => !!document.getElementById('q'),
    run: () => { const q = document.getElementById('q'); q.focus(); q.select(); },
  },
  F3: {
    title: '决策史：跳到本页的决策史小节',
    enabled: () => !!decisionSection(),
    run: () => decisionSection()?.scrollIntoView({ block: 'start' }),
  },
  F4: {
    // D8：本期检查器只有引出线注记（阶段 C 才有内容）→ 无注记时不注册，避免死键。
    // title 是函数：开关状态变了标题要跟着变（「检查」按下去到底是开还是关，按钮得说清楚）。
    title: () => (INSPECTOR_OPEN ? '检查：收起引出线注记栏' : '检查：展开引出线注记栏'),
    enabled: () => INSPECTOR_NOTES.length > 0,     // 判据是「有注记」，不是「当前可见」（收起后仍要能再开）
    run: () => toggleInspector(),
  },
  F5: {
    // D5：F5 是浏览器刷新键，整页重载会打断阅读 → **恒 preventDefault**（见下方 keydown）；
    // 有可重写的正文时才真的重写（docs 物化页 / 控制台没有重写按钮 → 只吃掉这次刷新）。
    title: '重写这页',
    enabled: () => !!rewriteButton(),
    run: () => rewriteButton()?.click(),
  },
};

// 本页的决策史小节：fold 物化的 `## Decision history` / `## 决策史`。没有 → F3 不注册。
const decisionSection = () => [...document.querySelectorAll('#content h2')]
  .find(h => /^(决策史|决策历史|决策与时间线|Decision history\b)/i.test(h.textContent.trim())) ?? null;

// 「✏️ 重写这页」按钮由既有 renderMeta 产出、住 #meta（不在 #content）。F5 与顶栏按钮都
// **委托它 .click()**——不复制一份排队逻辑（复制出来的第二套迟早与 route() 里那份漂移）。
const rewriteButton = () => document.querySelector('#meta button[data-rewrite-page]');

// FKEY 条目的标题：纯字符串是常态；F4 的标题是函数（开/关是两个不同的动作，得分别说）
const slotTitle = spec => (typeof spec.title === 'function' ? spec.title() : spec.title);

// 快捷键动作的**唯一入口**：鼠标 click 与 F1–F5 键盘路径都汇到这里，再不重复 run() 里的逻辑。
// 未知键静默返回（静态 markup 与 FKEY 表的键一一对应，走到这里说明表被改漏了，不该抛给用户）。
function runFkey(key) {
  const spec = FKEY[key];
  if (spec) spec.run();
}

function refreshShortcuts() {
  for (const btn of document.querySelectorAll('#fkeys .fkey')) {
    const spec = FKEY[btn.dataset.fkey];
    const on = !!spec && spec.enabled();
    const label = spec ? slotTitle(spec) : '';     // F4 的标题随开/关变 → 允许 title 是函数（其余键仍是字符串）
    btn.disabled = !on;
    btn.title = spec ? (on ? label : `${label}（本页无内容）`) : '';
  }
  const rb = document.getElementById('rewrite-page');
  const canRewrite = !!rewriteButton();
  rb.disabled = !canRewrite;
  rb.title = canRewrite
    ? '按你的要求改进这页（可填具体指令）'
    : '当前页没有可重写的正文（docs 物化页 / 控制台）';
}

function wireShortcuts() {
  document.getElementById('rewrite-page').onclick = () => rewriteButton()?.click();
  // 按钮的**唯一动作入口**（审计 🔴#1）。FKEY 里五个键各自写好了 run()，却从没人调用它——
  // 「定义了 handler 但没接线」正是 D8 要禁的死键：鼠标点没反应，键盘 btn.click() 也只是
  // 触发一次**没有监听者**的 click，同样没反应。
  // 用容器上的事件委托（不是逐按钮 .onclick）：静态 markup 里的五个键恒在、不会重建，
  // 但委托少一处「漏绑一个键」的机会，与 wireSearch/wireInspector 的既有写法一致。
  document.getElementById('fkeys').addEventListener('click', e => {
    const btn = e.target.closest?.('.fkey');
    if (!btn || btn.disabled) return;    // disabled 的键浏览器本就不派发 click，这里再挡一道不绕过 enabled 判定
    runFkey(btn.dataset.fkey);
  });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;    // Ctrl+F5 之类的组合键留给浏览器
    if (!/^F[1-5]$/.test(e.key)) return;
    if (e.key === 'F5') e.preventDefault();            // D5：刷新键会打断阅读，恒吃掉
    const btn = document.querySelector(`#fkeys .fkey[data-fkey="${e.key}"]`);
    if (!btn || btn.disabled) return;                  // 未注册的键不额外抢浏览器默认行为
    e.preventDefault();
    btn.click();                                       // 走上面那条 click 委托 → runFkey：键盘与鼠标**同一条**动作路径
  });
  // 正文 / 页面元数据都是客户端注入的：落地后重刷可用性（只改 disabled/title，不再触发 mutation）
  new MutationObserver(refreshShortcuts).observe(document.getElementById('main'), { childList: true, subtree: true });
  window.addEventListener('hashchange', refreshShortcuts);
  refreshShortcuts();
}

function wireTheme() {
  const sel = document.getElementById('theme');
  // 默认亮色（设计 §5.1 浅色精密工作台）；dark / sepia 仍是可切换的两档（D10）
  const saved = localStorage.getItem('lore-theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  sel.value = saved;
  sel.addEventListener('change', () => {
    document.documentElement.setAttribute('data-theme', sel.value);
    localStorage.setItem('lore-theme', sel.value);
    if (mermaidLoad) {   // mermaid already on this page → re-theme + re-render its diagrams
      window.mermaid?.initialize({ startOnLoad: false, securityLevel: 'strict', theme: mapMermaidTheme(sel.value) });
      route();
    }
  });
}

// --- B1 同步控制台（spec 2026-06-09-lore-sync-console）---
let SYNC_STATUS = null;        // GET /api/sync/status 结果；API 不可用（python/portal）→ null
let SYNC_API_OK = false;
let QUEUED_PAGES = new Set();  // 已排队 page path（渲染「已排队 ✓」）
// 「列表端点读到了吗」必须与「读到几条」分开记（D13）：只记条数的话，一次失败就只剩 size=0，
// 而 0 是「测出来是零」、拿不到是「测不出来」——混同就会把「列表端点挂了」渲染成「0 条排队请求」。
// 这正是 buildStatusLine 上一轮刚从纯函数里堵掉的反模式，调用点不许再把它放回来。
let QUEUED_OK = false;         // false = 没读到（还没轮询到 / rewrite-requests 失败）→ 读数一律 unknown
let SYNC_RUNS = [];            // auto 任务历史（console 表格消费）

// 队列读数的两个出口，都按 D13 区分「测出来是零」与「测不出来」：
//   ① 状态行的提示语形参 —— 取不到传 undefined，让 buildStatusLine 落到 unknown 分支（真值 0 必须显式传 0）；
//   ② 控制台的「已排队请求」单元格 —— 取不到报 unknown，不报 0 条。
function queuedArg() { return QUEUED_OK ? QUEUED_PAGES.size : undefined; }
function queuedCountText() { return QUEUED_OK ? `${QUEUED_PAGES.size} 条` : 'unknown（列表端点读不到）'; }

// 三段 fetch 各自独立失败，**不许连坐**：主 status 的 fetch+parse 在自己的 try 里，
// 二次列表（rewrite-requests / runs）各在自己的嵌套 try 里。为什么必须拆开：原先一个 try 包住三段，
// 一旦 rewrite-requests 抛错（而 status 其实成功了），catch 会把**已经解析好的 status 载荷整个丢掉**
// ——SYNC_STATUS=null / SYNC_API_OK=false，状态行与 sync 灯无谓地降级成 unknown/静态，
// 而这正是本期核心交付（状态行的燃料读数）的数据源。二次列表失败只清它自己那一份读数。
async function fetchSyncStatus() {
  try {
    const r = await fetch(BASE + 'api/sync/status');
    if (!r.ok) throw new Error();
    SYNC_STATUS = await r.json();
    SYNC_API_OK = true;
  } catch {
    SYNC_STATUS = null; SYNC_API_OK = false;   // 主 status 失败：维持现状降级（状态行转静态读数）
  }
  try {
    const q = await (await fetch(BASE + 'api/sync/rewrite-requests')).json();
    QUEUED_PAGES = new Set((q.requests ?? []).map(x => x.page));
    QUEUED_OK = true;                                          // 读到了：真值 0 也照报 0
  } catch { QUEUED_PAGES = new Set(); QUEUED_OK = false; }     // 读不到：清空 + 标未读到（读数出口据此报 unknown）
  try { SYNC_RUNS = (await (await fetch(BASE + 'api/sync/runs')).json()).runs ?? []; }
  catch { SYNC_RUNS = []; }
}

// --- manifest 轮询：15s 慢轮询常驻；操作后 1s×10 快轮询（秒级反馈）。纯 GET，三 serve 形态全兼容。
let LAST_GENERATED = null, POLL_TIMER = null, FAST_LEFT = 0;

async function pollTick() {
  if (document.hidden) return;                                   // 后台 tab 不空转
  let fresh;
  try { fresh = await (await fetch(BASE + 'wiki/.manifest.json', { cache: 'no-store' })).json(); }   // 绕过 python serve 启发式缓存
  catch { return; }
  // 坏 manifest（合法 JSON 但缺 axes / axes 非数组 / 整个是 null）不得让 15s 轮询变成未处理拒绝风暴：
  // 下一行曾是 `for (const ax of fresh.axes)` 裸访——每 15 秒一次 TypeError。这里放弃这一轮
  // （与 buildVisitPathIndex / buildConsoleModel 的 `?? []` 同口径：测不出就什么都不做），
  // 同时**不推进 LAST_GENERATED、不拿坏数据重建侧栏**——把读者正在看的目录清空比空转一轮坏得多。
  // 下一轮 15s 后照常重试，天然自愈。
  const axes = Array.isArray(fresh?.axes) ? fresh.axes : null;
  if (!axes) return;
  const currentKey = location.hash.slice(1) || firstPageKey();   // 与 route 对齐：落地页（无 hash）也能出提示条
  const before = JSON.stringify(FLAT[currentKey] ?? null);
  const flatNew = {};
  for (const ax of axes) for (const p of (ax?.pages ?? [])) flatNew[`${ax.id}/${p.id}`] = p;
  const d = pollDecide(LAST_GENERATED, fresh.generated, JSON.stringify(flatNew[currentKey] ?? null) !== before);
  LAST_GENERATED = fresh.generated;
  if (!d.changed) return;
  MANIFEST = fresh; PAGE_INDEX = buildPageIndex(MANIFEST); FLAT = flatNew;
  BOOT_ERROR = null;   // 目录已经读到 → 首屏的失败态解除（状态行的页数/队列读数不再停在 unknown）
  if (d.rebuildSidebar) {
    buildSidebar();   // 全量重建 → 把瞬态 UI 状态接回来：active 高亮 + 搜索过滤
    const hash = location.hash.slice(1) || firstPageKey();
    document.querySelectorAll('#sidebar a').forEach(a => a.classList.toggle('active', a.dataset.key === hash));
    const q = document.getElementById('q');
    if (q.value.trim()) q.dispatchEvent(new Event('input'));
  }
  await fetchSyncStatus(); renderSyncLight();
  if (location.hash.slice(1) === 'console') renderConsolePage();
  if (d.showUpdateBar) showUpdateBar();
  if (FAST_LEFT > 0) { FAST_LEFT = 0; schedulePoll(15000); }     // 快轮询命中 → 回落慢轮询
}

function schedulePoll(ms) {
  clearInterval(POLL_TIMER);
  POLL_TIMER = setInterval(async () => {
    await pollTick();
    if (FAST_LEFT > 0 && --FAST_LEFT === 0) schedulePoll(15000); // 快轮询用尽未命中 → 回落
  }, ms);
}

function startFastPoll() { FAST_LEFT = 10; schedulePoll(1000); }

function showUpdateBar() {
  if (document.getElementById('update-bar')) return;
  const bar = document.createElement('div');
  bar.id = 'update-bar';
  bar.textContent = '⟳ 内容已更新，点击刷新本页';
  bar.onclick = () => { bar.remove(); route(); };
  document.getElementById('content').prepend(bar);
}

// 底部状态行（设计 §5.3 / §5.5；壳阶段 B）。读数怎么算**全在 shell.mjs 的纯函数**里（Node 可直测），
// 这里只做三件事：把字段填进已存在的 markup、给「队列 N」接上打开 #sync-panel 的动作（§5.5 硬项：
// 点不动就是装饰性遥测）、以及预算超限的显隐。SYNC_STATUS 为 null（python serve / portal / 未 init）时
// 纯函数自然降级为静态读数（燃料 unknown + manifest 的页数/队列），不报错、不空白（验收 6）。
function renderStatusLine() {
  // manifest 没读到时不把安全默认的 `{axes: []}` 当成「测出来就是 0 页」喂进去：那是 D13 点名的
  // 反模式（0 是「测出来是零」，取不到是「测不出」）。传 null 让页数/队列读数落到 unknown，
  // 与正文区的失败提示一致；目录真读到之后（pollTick 恢复）BOOT_ERROR 会被清掉，读数自动回真值。
  const line = buildStatusLine({ status: SYNC_STATUS, manifest: BOOT_ERROR ? null : MANIFEST, queued: queuedArg() });
  const fill = (id, text, cls) => {
    const el = document.getElementById(id);
    el.textContent = text;
    if (cls !== undefined) el.className = cls;
  };
  fill('status-capture', line.capture_text, line.capture_class);
  fill('status-rate', line.rate_text);
  fill('status-gap', line.gap_text);
  fill('status-pages', line.pages_text);
  fill('status-stamp', line.stamp_text);
  const q = document.getElementById('status-queue');
  q.textContent = line.queue_text;
  q.title = line.queue_hint;
  q.disabled = line.queue_count === null;      // 索引未就绪才禁用；有数就必须点得开
  const b = document.getElementById('status-budget');
  b.textContent = line.budget_text;
  b.hidden = !line.budget_text;                // 未超限/未配置 → 一个字都不加
}

function renderSyncLight() {
  const m = buildConsoleModel(MANIFEST, SYNC_STATUS);
  const light = document.getElementById('sync-light');
  light.className = m.light === 'fresh' ? '' : m.light;          // '' | 'stale' | 'off'
  const lightText =
    m.light === 'off' ? `手动 · ${m.staleTotal} 待写`
    : m.light === 'busy' ? '自动重写中…'
    : m.staleTotal ? `${m.staleTotal} 待重写` : '全新鲜';
  // 预算超限是 auto 档停摆的唯一原因出口（S6）——没超限/没配置就一个字都不加（遥测位不塞噪音）。
  const budget = budgetNotice(SYNC_STATUS);
  document.getElementById('sync-light-text').textContent = budget ? `${lightText} · ${budget}` : lightText;
  const autoInfo = document.getElementById('sync-auto-info');
  autoInfo.hidden = m.mode !== 'auto';
  if (m.mode === 'auto') {
    const c = SYNC_STATUS?.config ?? {};
    document.getElementById('sync-auto-info-text').textContent =
      `静默 ${c.debounce_minutes ?? 10}min${c.schedule ? ' · 每日 ' + c.schedule : ''} · 单次 ≤${c.max_pages ?? 5} 页 · 后端 ${c.backend ?? 'auto'}`;
  }
  document.querySelectorAll('#sync-panel .seg button').forEach(b =>
    b.classList.toggle('on', b.dataset.mode === m.mode));
  document.getElementById('sync-stale-summary').textContent = m.staleTotal
    ? m.stalePages.slice(0, 2).map(p => `${p.key.split('/').pop()} ⚠${p.stale}`).join(' · ') + (m.staleTotal > 2 ? ` 等${m.staleTotal}页` : '')
    : '无';
  document.getElementById('sync-last').textContent = m.lastFinalize
    ? new Date(m.lastFinalize).toLocaleString() : '—';
  for (const id of ['sync-finalize', 'sync-queue-all']) {
    const btn = document.getElementById(id);
    btn.disabled = !SYNC_API_OK;
    btn.title = SYNC_API_OK ? '' : '只读模式（portal 或 python server）——本地 /lore:serve --node 可操作';
  }
  // 排队按钮三态：有未排队页 → 显剩余数；全部已排队 → ✓ 锁定；无 stale → 原样禁用
  const qa = document.getElementById('sync-queue-all');
  if (SYNC_API_OK) {
    const unqueued = m.stalePages.filter(p => p.path && !QUEUED_PAGES.has(p.path)).length;
    if (m.staleTotal === 0) { qa.disabled = true; qa.textContent = '✍ 重写排队'; }
    else if (unqueued === 0) { qa.disabled = true; qa.textContent = `✓ 已排队 ${m.staleTotal} 页`; }
    else { qa.textContent = `✍ 重写排队 (${unqueued})`; }
  }
  document.querySelectorAll('#sync-panel .seg button:not([data-mode="auto"])').forEach(b => {
    b.disabled = !SYNC_API_OK;
    b.title = SYNC_API_OK ? '' : '只读模式';
  });
  // 状态行与 sync 灯同源刷新：两者读的是同一份 SYNC_STATUS / QUEUED_PAGES，不该各刷各的。
  renderStatusLine();
}

function wireSyncConsole() {
  const light = document.getElementById('sync-light');
  const panel = document.getElementById('sync-panel');
  light.onclick = () => { panel.hidden = !panel.hidden; };
  // 状态行的「队列 N」是打开同一面板的第二个入口（§5.5 硬项：点得进去才不是装饰性遥测）。
  document.getElementById('status-queue').onclick = () => { panel.hidden = false; };
  document.addEventListener('click', e => {
    // 从状态行点开面板时，这次 click 会冒泡到 document——不把入口本身算作「点在外面」，
    // 否则面板刚开就被这同一个事件关掉（点不动的假象）。
    if (!panel.hidden && !panel.contains(e.target) && !light.contains(e.target)
      && !e.target.closest('#status-queue')) panel.hidden = true;
  });
  document.querySelectorAll('#sync-panel .seg button[data-mode]').forEach(b => {
    b.onclick = async () => {
      try {
        await fetch(BASE + 'api/sync/mode', { method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ mode: b.dataset.mode }) });
      } catch { /* 失败也读回真值 */ }
      await fetchSyncStatus(); renderSyncLight();              // 读回显示（硬约束②：存→读全链路）
    };
  });
  document.getElementById('sync-finalize').onclick = async () => {
    try {
      await fetch(BASE + 'api/sync/finalize', { method: 'POST' });
      startFastPoll();                                           // 快轮询秒级反馈
    } catch { await fetchSyncStatus(); renderSyncLight(); }      // server 挂了 → 降级态自然亮出
  };
  document.getElementById('sync-queue-all').onclick = async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true; btn.textContent = '排队中…';            // 点击即时反馈，完成后 renderSyncLight 置「✓ 已排队 N 页」
    const m = buildConsoleModel(MANIFEST, SYNC_STATUS);
    for (const p of m.stalePages) {
      if (p.path && !QUEUED_PAGES.has(p.path)) {
        try { await fetch(BASE + 'api/sync/rewrite-requests', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ page: p.path }) }); } catch {}
      }
    }
    await fetchSyncStatus(); renderSyncLight();
  };
  document.getElementById('sync-detail').onclick = () => { panel.hidden = true; location.hash = 'console'; };
}

const LB = (() => {
  const lb = document.getElementById('lb'), stage = document.getElementById('lb-stage');
  let svg = null, scale = 1, tx = 0, ty = 0, drag = null;
  const apply = () => { if (svg) svg.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`; };
  const open = async (div) => {
    await ensureMermaid();   // 按当前壳主题重新渲染这张图（init 指令跟主题，绕过全局缓存）
    let out;
    try { ({ svg: out } = await window.mermaid.render('lbR' + Date.now(), themedSrc(div.dataset.src, document.documentElement.getAttribute('data-theme')))); }
    catch { out = div.innerHTML; }   // 源码缺失/坏图 → 退回克隆已渲染的
    stage.innerHTML = out; svg = stage.querySelector('svg');   // 保留 render 的 svg id：mermaid 的 <style> scoped 到该 id，删了主题样式全失配→节点变默认黑
    scale = 1; tx = 0; ty = 0; apply(); lb.classList.add('open');
  };
  const close = () => { lb.classList.remove('open'); stage.innerHTML = ''; svg = null; };
  const zoom = (f, cx, cy) => {                              // 以 (cx,cy) 为锚缩放
    const ns = Math.min(8, Math.max(0.2, scale * f));
    if (cx != null) { const r = stage.getBoundingClientRect(); const ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2;
      tx = ox - (ox - tx) * (ns / scale); ty = oy - (oy - ty) * (ns / scale); }
    scale = ns; apply();
  };
  document.getElementById('lb-in').onclick = () => zoom(1.25);
  document.getElementById('lb-out').onclick = () => zoom(0.8);
  document.getElementById('lb-reset').onclick = () => { scale = 1; tx = 0; ty = 0; apply(); };
  document.getElementById('lb-close').onclick = close;
  lb.onclick = e => { if (e.target === lb || e.target === stage) close(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('open')) close(); });
  stage.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : 0.89, e.clientX, e.clientY); }, { passive: false });
  stage.addEventListener('pointerdown', e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
  stage.addEventListener('pointerup', e => { drag = null; stage.classList.remove('dragging'); stage.releasePointerCapture(e.pointerId); });
  return { open };
})();

boot();
</script>
