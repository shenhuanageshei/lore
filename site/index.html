<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lore wiki</title>
<style>
  :root {
    --bg: #1a1b26; --sidebar: #16161e; --panel: #1f2130;
    --fg: #c0caf5; --fg-dim: #565f89; --fg-bright: #ffffff;
    --accent: #7aa2f7; --accent-dim: #3d59a1;
    --green: #9ece6a; --yellow: #e0af68; --red: #f7768e;
    --border: #2a2e42; --code-bg: #1e202e;
    --comp: #7dcfff; --flow: #bb9af7; --theme: #ff9e64; --docs: var(--green);
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --sidebar:#f4f5f8; --panel:#eef0f4; --fg:#24283b; --fg-dim:#787c99;
    --fg-bright:#1a1b26; --accent:#3760bf; --accent-dim:#a4b3e0; --border:#dcdfe6;
    --code-bg:#eef0f4; --green:#587539; --yellow:#8c6c20; --red:#c64343;
    --comp:#2e7de9; --flow:#7847bd; --theme:#b15c00;
  }
  :root[data-theme="sepia"] {
    --bg:#f4ecd8; --sidebar:#ece2c8; --panel:#e7dcc0; --fg:#5b4636; --fg-dim:#9c8b73;
    --fg-bright:#3b2f25; --accent:#9a6a3a; --accent-dim:#cdb892; --border:#d9c9a3;
    --code-bg:#e7dcc0; --green:#6b7536; --yellow:#9a6a20; --red:#a8443a;
    --comp:#7a6a3a; --flow:#8a5a6a; --theme:#9a6a3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px/1.6 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background: var(--bg); color: var(--fg); height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-columns: 280px 1fr; grid-template-rows: 52px 1fr; height: 100vh; }

  /* top bar */
  #topbar { grid-column: 1 / 3; background: var(--sidebar); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; padding: 0 18px; }
  #brand { font-weight: 700; color: var(--fg-bright); letter-spacing: .5px; }
  #brand .dim { color: var(--fg-dim); font-weight: 400; font-size: 12px; }
  #search { flex: 1; max-width: 420px; }
  #search input { width: 100%; background: var(--panel); border: 1px solid var(--border);
    color: var(--fg); padding: 7px 12px; border-radius: 7px; font-size: 13px; }
  #search input:focus { outline: none; border-color: var(--accent); }
  #theme, #language { background: var(--panel); border: 1px solid var(--border); color: var(--fg);
    padding: 6px 10px; border-radius: 7px; font-size: 13px; cursor: pointer; }
  #theme:focus, #language:focus { outline: none; border-color: var(--accent); }
  #serve-badge { margin-left: auto; font-size: 11px; color: var(--green);
    background: rgba(158,206,106,.12); padding: 4px 10px; border-radius: 12px; }

  /* sidebar */
  #sidebar { background: var(--sidebar); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 12px 0; }
  .axis { margin-bottom: 6px; }
  .axis-h { display: flex; align-items: center; gap: 7px; padding: 7px 16px 4px;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--fg-dim); cursor: pointer;
    user-select: none; }
  .axis-h .dot { width: 7px; height: 7px; border-radius: 50%; }
  .axis-h .caret { margin-left: auto; transition: transform .15s; font-size: 9px; }
  .axis.collapsed .caret { transform: rotate(-90deg); }
  .axis.collapsed .links { display: none; }
  .dot.component { background: var(--comp); }
  .dot.flow { background: var(--flow); }
  .dot.theme { background: var(--theme); }
  .dot.docs { background: var(--docs); }
  .dot.index { background: var(--fg-dim); }
  .dot.HOME { background: var(--accent); }
  .dot.INDEX { background: var(--fg-dim); }
  .links a { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 5px 16px 5px 30px;
    color: var(--fg); text-decoration: none; font-size: 13px; border-left: 2px solid transparent; }
  .links a:hover { background: var(--panel); }
  .links a.active { background: var(--panel); border-left-color: var(--accent); color: var(--fg-bright); }
  .links a .stale { margin-left: auto; font-size: 10px; color: var(--yellow); }
  .links a .when { flex-basis: 100%; font-size: 10px; color: var(--fg-dim); }
  .links a.hidden { display: none; }

  /* main */
  #main { overflow-y: auto; padding: 0; }
  #meta { background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 36px; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; align-items: center; }
  #meta .chip { display: flex; align-items: center; gap: 6px; color: var(--fg-dim); }
  #meta .chip b { color: var(--fg); font-weight: 500; }
  #meta .chip.stale { color: var(--yellow); }
  #meta .chip.fresh { color: var(--green); }
  #meta button.chip { font: inherit; cursor: pointer; border: 1px solid currentColor;
    background: transparent; border-radius: 6px; padding: 2px 8px; }
  #content { padding: 28px 36px 80px; max-width: 860px; }
  #content h1 { font-size: 28px; color: var(--fg-bright); margin: 8px 0 18px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border); }
  #content h2 { font-size: 20px; color: var(--accent); margin: 28px 0 12px; }
  #content h3 { font-size: 16px; color: var(--fg-bright); margin: 20px 0 8px; }
  #content p { margin: 10px 0; }
  #content ul, #content ol { margin: 10px 0 10px 24px; }
  #content li { margin: 4px 0; }
  #content code { background: var(--code-bg); padding: 2px 6px; border-radius: 4px;
    font-family: "SF Mono",Consolas,monospace; font-size: 12.5px; color: var(--green); }
  #content pre { background: var(--code-bg); padding: 14px 16px; border-radius: 8px; overflow-x: auto;
    margin: 12px 0; border: 1px solid var(--border); }
  #content pre code { background: none; padding: 0; color: var(--fg); }
  #content a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
  #content a:hover { border-bottom-color: var(--accent); }
  #content a.wikilink { color: var(--flow); border-bottom-color: transparent;
    background: rgba(187,154,247,.12); padding: 1px 6px; border-radius: 4px; }
  #content a.wikilink::before { content: "🔗 "; font-size: 11px; }
  #content blockquote { border-left: 3px solid var(--accent-dim); padding: 4px 16px; margin: 12px 0;
    color: var(--fg-dim); background: rgba(122,162,247,.05); }
  #content table { border-collapse: collapse; margin: 14px 0; width: 100%; }
  #content th, #content td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; font-size: 13px; }
  #content th { background: var(--panel); color: var(--fg-bright); }
  #content hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
  .tl { border-left: 2px solid var(--border); padding-left: 18px; margin: 14px 0; }
  .tl-item { position: relative; margin: 16px 0; }
  .tl-item::before { content: ""; position: absolute; left: -23px; top: 6px; width: 8px; height: 8px;
    border-radius: 50%; background: var(--accent); }
  .tl-item .when { font-size: 11px; color: var(--fg-dim); }
  .tl-item .badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
  .badge.extracted { background: rgba(158,206,106,.15); color: var(--green); }
  .badge.inferred { background: rgba(224,175,104,.15); color: var(--yellow); }
  .hidden { display: none; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  #content .mermaid { cursor: zoom-in; }
  #lb { position: fixed; inset: 0; z-index: 99; display: none; background: rgba(0,0,0,.78); }
  #lb.open { display: block; }
  #lb-stage { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
  #lb-stage svg { position: absolute; top: 50%; left: 50%; transform-origin: 0 0; cursor: grab; max-width: none;
    background: var(--bg); border-radius: 8px; padding: 16px; box-shadow: 0 8px 40px rgba(0,0,0,.6); }
  #lb-stage.dragging svg { cursor: grabbing; }
  #lb-bar { position: absolute; top: 14px; right: 16px; display: flex; gap: 8px; z-index: 1; }
  #lb-bar button { background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.35);
    width: 34px; height: 34px; border-radius: 8px; font-size: 16px; cursor: pointer; }
  #lb-bar button:hover { background: rgba(255,255,255,.25); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="brand">lore <span class="dim">// .lore/wiki</span></div>
    <div id="search"><input id="q" placeholder="🔍 搜索页面 (title + 摘要)..." autocomplete="off"></div>
    <select id="language" title="Language"></select>
    <select id="theme" title="主题">
      <option value="dark">🌙 暗</option>
      <option value="light">☀ 亮</option>
      <option value="sepia">🌿 护眼</option>
    </select>
    <div id="serve-badge">● serving</div>
  </div>
  <nav id="sidebar"></nav>
  <main id="main">
    <div id="meta"></div>
    <article id="content"></article>
  </main>
</div>

<div id="lb">
  <div id="lb-bar">
    <button id="lb-in" title="放大">＋</button>
    <button id="lb-out" title="缩小">−</button>
    <button id="lb-reset" title="复位">⟲</button>
    <button id="lb-close" title="关闭 (ESC)">✕</button>
  </div>
  <div id="lb-stage"></div>
</div>

<script type="module">
import {
  stripFrontmatter, renderMarkdown, buildPageIndex, preprocessWikilinks,
  buildNavModel, buildMeta, chooseInitialLanguage, resolveLocalizedPage,
  baseFromPathname,
} from './shell.mjs';

// per-repo serve 下 BASE="/"（行为同旧 ../wiki）；portal 下 BASE="/<repo>/"。
const BASE = baseFromPathname(location.pathname);

const mapMermaidTheme = t => (t === 'dark' ? 'dark' : 'default');
const themedSrc = (src, t) => `%%{init: {'theme':'${mapMermaidTheme(t)}'}}%%\n` + src;   // per-diagram 主题指令：每次渲染重新定主题，绕过 mermaid 全局 init 的主题缓存

let mermaidLoad = null;   // Promise once mermaid.min.js has been injected + initialized
function ensureMermaid() {
  if (!mermaidLoad) {
    mermaidLoad = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = './mermaid.min.js';
      s.onload = () => {
        try {
          window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: mapMermaidTheme(document.documentElement.getAttribute('data-theme')) });
          resolve();
        } catch (e) { mermaidLoad = null; reject(e); }
      };
      s.onerror = (e) => { mermaidLoad = null; reject(e); };
      document.head.appendChild(s);
    });
  }
  return mermaidLoad;
}

let MANIFEST = { axes: [] }, PAGE_INDEX = {}, FLAT = {}, SELECTED_LANG = 'en';

async function boot() {
  MANIFEST = await (await fetch(BASE + 'wiki/.manifest.json')).json();
  PAGE_INDEX = buildPageIndex(MANIFEST);
  FLAT = {};
  for (const ax of MANIFEST.axes) for (const p of ax.pages) FLAT[`${ax.id}/${p.id}`] = p;
  SELECTED_LANG = chooseInitialLanguage(MANIFEST, localStorage.getItem('lore-language'));
  buildSidebar();
  wireSearch();
  wireTheme();
  wireLanguage();
  window.addEventListener('hashchange', route);
  route();
}

function wireLanguage() {
  const sel = document.getElementById('language');
  const cfg = MANIFEST.language ?? { default: 'en', available: ['en'] };
  sel.innerHTML = cfg.available.map(lang => `<option value="${lang}">${lang}</option>`).join('');
  sel.value = SELECTED_LANG;
  sel.style.display = cfg.available.length > 1 ? '' : 'none';
  sel.addEventListener('change', async () => {
    SELECTED_LANG = sel.value;
    localStorage.setItem('lore-language', SELECTED_LANG);
    try {
      await fetch(BASE + 'api/preferences', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ language: SELECTED_LANG }),
      });
    } catch { /* static (python) server has no API; localStorage still persists */ }
    route();
  });
}

function buildSidebar() {
  const nav = document.getElementById('sidebar');
  nav.innerHTML = buildNavModel(MANIFEST).map(ax => `
    <div class="axis" data-axis="${ax.id}">
      <div class="axis-h"><span class="dot ${ax.id}"></span>${ax.label}<span class="caret">▼</span></div>
      <div class="links">
        ${ax.pages.map(p => `<a href="#${ax.id}/${p.id}" data-key="${ax.id}/${p.id}"
           data-search="${(p.title + ' ' + (p.summary||'')).toLowerCase()}">
          ${p.title}${p.stale ? `<span class="stale">⚠${p.stale}</span>` : ''}${ax.id === 'docs' && p.last_updated ? `<span class="when">📅 ${p.last_updated}</span>` : ''}</a>`).join('')}
      </div>
    </div>`).join('');
  nav.querySelectorAll('.axis-h').forEach(h =>
    h.onclick = () => h.parentElement.classList.toggle('collapsed'));
}

function renderMeta(page) {
  const cls = { plain: 'chip', stale: 'chip stale', fresh: 'chip fresh' };
  return buildMeta(page).chips.map(c =>
    `<span class="${cls[c.kind]}">${c.icon} ${c.text}</span>`).join('');
}

function renderTranslateState(page, localized) {
  if (!localized.missing && !localized.stale) return '';
  const text = localized.stale ? `translation stale: ${localized.lang}` : `translation missing: ${localized.lang}`;
  return `<button id="translate-page" class="chip stale" data-page="${page.path}" data-lang="${localized.lang}">🌐 ${text}</button>`;
}

async function route() {
  const hash = location.hash.slice(1) || firstPageKey();
  const page = FLAT[hash];
  document.querySelectorAll('#sidebar a').forEach(a =>
    a.classList.toggle('active', a.dataset.key === hash));
  if (!page) {
    document.getElementById('meta').innerHTML = '';
    document.getElementById('content').innerHTML = `<h1>404</h1><p>无此页：<code>${hash}</code></p>`;
    return;
  }
  const localized = resolveLocalizedPage(page, SELECTED_LANG);
  const raw = await (await fetch(BASE + 'wiki/' + localized.path)).text();
  const html = preprocessWikilinks(renderMarkdown(stripFrontmatter(raw)), PAGE_INDEX);
  document.getElementById('meta').innerHTML = renderMeta(page) + renderTranslateState(page, localized);
  document.getElementById('content').innerHTML = html;
  const mNodes = document.querySelectorAll('#content .mermaid');
  if (mNodes.length) {
    const tNow = document.documentElement.getAttribute('data-theme');
    mNodes.forEach(div => { if (div.dataset.src == null) div.dataset.src = div.textContent; div.textContent = themedSrc(div.dataset.src, tNow); });   // 存纯源码 + 注入当前主题指令再渲染
    try { await ensureMermaid(); await window.mermaid.run({ nodes: mNodes }); }
    catch { /* missing asset or bad diagram: leave source text visible, page stays usable */ }
    mNodes.forEach(div => { if (div.querySelector('svg')) div.onclick = () => LB.open(div); });
  }
  const translateBtn = document.getElementById('translate-page');
  if (translateBtn) {
    translateBtn.onclick = async () => {
      translateBtn.disabled = true;
      translateBtn.textContent = '🌐 translation requested';
      try {
        await fetch(BASE + 'api/translation-requests', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ page: translateBtn.dataset.page, target_lang: translateBtn.dataset.lang }),
        });
      } catch {
        translateBtn.textContent = `run: node lib/translate.js plan .lore ${translateBtn.dataset.page} ${translateBtn.dataset.lang}`;
      }
    };
  }
  document.getElementById('main').scrollTop = 0;
}

function firstPageKey() {
  for (const ax of MANIFEST.axes) if (ax.pages[0]) return `${ax.id}/${ax.pages[0].id}`;
  return '';
}

function wireSearch() {
  document.getElementById('q').addEventListener('input', e => {
    const term = e.target.value.toLowerCase().trim();
    document.querySelectorAll('#sidebar .links a').forEach(a =>
      a.classList.toggle('hidden', term && !a.dataset.search.includes(term)));
    document.querySelectorAll('.axis').forEach(ax => {
      const any = [...ax.querySelectorAll('a')].some(a => !a.classList.contains('hidden'));
      ax.style.display = any ? '' : 'none';
    });
  });
}

function wireTheme() {
  const sel = document.getElementById('theme');
  const saved = localStorage.getItem('lore-theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  sel.value = saved;
  sel.addEventListener('change', () => {
    document.documentElement.setAttribute('data-theme', sel.value);
    localStorage.setItem('lore-theme', sel.value);
    if (mermaidLoad) {   // mermaid already on this page → re-theme + re-render its diagrams
      window.mermaid?.initialize({ startOnLoad: false, securityLevel: 'strict', theme: mapMermaidTheme(sel.value) });
      route();
    }
  });
}

const LB = (() => {
  const lb = document.getElementById('lb'), stage = document.getElementById('lb-stage');
  let svg = null, scale = 1, tx = 0, ty = 0, drag = null;
  const apply = () => { if (svg) svg.style.transform = `translate(-50%,-50%) translate(${tx}px,${ty}px) scale(${scale})`; };
  const open = async (div) => {
    await ensureMermaid();   // 按当前壳主题重新渲染这张图（init 指令跟主题，绕过全局缓存）
    let out;
    try { ({ svg: out } = await window.mermaid.render('lbR' + Date.now(), themedSrc(div.dataset.src, document.documentElement.getAttribute('data-theme')))); }
    catch { out = div.innerHTML; }   // 源码缺失/坏图 → 退回克隆已渲染的
    stage.innerHTML = out; svg = stage.querySelector('svg');   // 保留 render 的 svg id：mermaid 的 <style> scoped 到该 id，删了主题样式全失配→节点变默认黑
    scale = 1; tx = 0; ty = 0; apply(); lb.classList.add('open');
  };
  const close = () => { lb.classList.remove('open'); stage.innerHTML = ''; svg = null; };
  const zoom = (f, cx, cy) => {                              // 以 (cx,cy) 为锚缩放
    const ns = Math.min(8, Math.max(0.2, scale * f));
    if (cx != null) { const r = stage.getBoundingClientRect(); const ox = cx - r.left - r.width / 2, oy = cy - r.top - r.height / 2;
      tx = ox - (ox - tx) * (ns / scale); ty = oy - (oy - ty) * (ns / scale); }
    scale = ns; apply();
  };
  document.getElementById('lb-in').onclick = () => zoom(1.25);
  document.getElementById('lb-out').onclick = () => zoom(0.8);
  document.getElementById('lb-reset').onclick = () => { scale = 1; tx = 0; ty = 0; apply(); };
  document.getElementById('lb-close').onclick = close;
  lb.onclick = e => { if (e.target === lb || e.target === stage) close(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb.classList.contains('open')) close(); });
  stage.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY < 0 ? 1.12 : 0.89, e.clientX, e.clientY); }, { passive: false });
  stage.addEventListener('pointerdown', e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
  stage.addEventListener('pointerup', e => { drag = null; stage.classList.remove('dragging'); stage.releasePointerCapture(e.pointerId); });
  return { open };
})();

boot();
</script>
</body>
</html>
